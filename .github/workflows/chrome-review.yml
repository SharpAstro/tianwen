name: Chrome review

# The chrome-review agent (.claude/agents/chrome-review.md) reads a PR's src/TianWen.UI.* diff for layout arithmetic the
# DIR.Lib engine should own, posts what it found as one comment on the PR, and fails the check when a finding it rates
# high survives. It replaced a Stop hook (.claude/hooks/chrome_review_gate.py, removed 2026-11-19) that asked every
# session to run the agent before finishing: of its 106 asks, 34 ran the agent, about 45 were answered "no layout here"
# or "only the fixes since the last review", and 20, mostly in pilot flight worktrees, were ignored outright and still
# counted as reviewed. Here it runs once per state of the PR that a person is about to merge, whoever wrote it.
#
# Drafts are skipped: a draft is still moving, and every push would be a paid review. Marking a PR ready runs it, and so
# does a later push that changes the UI diff; a newer push cancels a review still running on an older one.
#
# What counts as UI is what the hook counted: the .cs and .razor files of the five projects below, not the benchmarks,
# the E2E harness, a shader's .spv or a README beside them. A paths filter reads the whole PR diff against its base, so
# it still starts this workflow on every later push of a PR that touches one of them, a docs fixup or a merge of main
# included. The fingerprint step below is what keeps those from being a second paid review (105k to 165k tokens each,
# docs/plans/viewer-layout-engine.md): it skips the agent when the UI diff is the one already reviewed.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/TianWen.UI.Abstractions/**/*.cs'
      - 'src/TianWen.UI.Abstractions/**/*.razor'
      - 'src/TianWen.UI.Shared/**/*.cs'
      - 'src/TianWen.UI.Shared/**/*.razor'
      - 'src/TianWen.UI.Gui/**/*.cs'
      - 'src/TianWen.UI.Gui/**/*.razor'
      - 'src/TianWen.UI.FitsViewer/**/*.cs'
      - 'src/TianWen.UI.FitsViewer/**/*.razor'
      - 'src/TianWen.UI.Web/**/*.cs'
      - 'src/TianWen.UI.Web/**/*.razor'

concurrency:
  group: chrome-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Not a draft, and not a fork: a fork's PR has no secrets, and a review is billed to the owner's subscription.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    # Measured locally a review takes one to two minutes (docs/plans/viewer-layout-engine.md); a run past this is stuck.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OUT: chrome-review-out
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The whole history, so the agent can diff against origin/main as it does on a dev box. No LFS and no submodules:
      # it reads source, it builds nothing.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      # The UI diff of this PR against its base, as one short hash. The comment a finished review leaves carries the
      # hash it reviewed and the count it found; when this push leaves that diff as it was, the agent is not run again
      # and the gate answers from that count. A review that did not finish leaves no hash, so it is never reused.
      - name: Fingerprint the UI diff
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          fp="$(git diff "$BASE...HEAD" -- \
            ':(glob)src/TianWen.UI.Abstractions/**/*.cs' ':(glob)src/TianWen.UI.Abstractions/**/*.razor' \
            ':(glob)src/TianWen.UI.Shared/**/*.cs' ':(glob)src/TianWen.UI.Shared/**/*.razor' \
            ':(glob)src/TianWen.UI.Gui/**/*.cs' ':(glob)src/TianWen.UI.Gui/**/*.razor' \
            ':(glob)src/TianWen.UI.FitsViewer/**/*.cs' ':(glob)src/TianWen.UI.FitsViewer/**/*.razor' \
            ':(glob)src/TianWen.UI.Web/**/*.cs' ':(glob)src/TianWen.UI.Web/**/*.razor' | sha256sum | cut -c1-16)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          first="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- chrome-review"))][0].body // empty' | head -n 1)"
          reviewed="$(printf '%s' "$first" | sed -n 's/.* fp:\([0-9a-f]\{16\}\) high:\([0-9][0-9]*\) -->.*/\1 \2/p')"
          if [ "${reviewed%% *}" = "$fp" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "high=${reviewed##* }" >> "$GITHUB_OUTPUT"
            echo "The UI diff ($fp) is the one already reviewed; the agent is not run again."
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the chrome-review agent
        if: ${{ steps.fingerprint.outputs.same != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet, as the agent's own frontmatter says: a checklist review does not need the larger model. Read-only
          # tools and the git reads the agent's instructions name; Write only for the two output files.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,Write,Bash(git fetch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            You are the chrome-review agent. Your instructions are the body of .claude/agents/chrome-review.md (everything
            after its frontmatter): read that file first and follow it exactly. The base to diff against is
            origin/${{ github.event.pull_request.base.ref }}; HEAD is the pull request's head.

            Before you report a finding, open the line it names and the method around it and confirm it holds. Drop any you
            cannot confirm.

            Write one file, and nothing else:
            - ${{ env.OUT }}/report.md: the report in the format the instructions give, each finding with its own
              "confidence: high" or "confidence: medium" line (or the instructions' "No chrome arithmetic in this diff."
              line and the files you read).

      # The counts are read off the report itself, one "confidence:" line per finding. The agent used to write a second
      # file with its own tally, and the gate trusted that alone: a report listing a high finding beside a tally of 0
      # passed, and the reverse failed a clean one. One statement of each finding leaves nothing to disagree.
      - name: Count the findings
        id: count
        if: ${{ !cancelled() && steps.fingerprint.outputs.same != 'true' }}
        run: |
          if [ ! -s "$OUT/report.md" ]; then
            echo "finished=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          high="$(grep -Eic '^[[:space:]]*confidence:[[:space:]]*high[[:space:]]*$' "$OUT/report.md" || true)"
          medium="$(grep -Eic '^[[:space:]]*confidence:[[:space:]]*medium[[:space:]]*$' "$OUT/report.md" || true)"
          clean="$(grep -c 'No chrome arithmetic in this diff' "$OUT/report.md" || true)"
          echo "high $high, medium $medium, says clean: $clean"
          # A report with no finding and no "nothing found" line says nothing that can be counted.
          if [ "$high" -eq 0 ] && [ "$medium" -eq 0 ] && [ "$clean" -eq 0 ]; then
            echo "finished=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "finished=true" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"

      # One comment per PR, edited in place on each run, so a PR does not collect a comment per push. Not on a
      # cancelled run: a push that supersedes a running review would overwrite the comment with "did not finish" for
      # the old commit, and two runs that find no comment yet would each post one. Nor when the diff was not reviewed
      # again: the comment already says what was found in it.
      - name: Post the report on the PR
        if: ${{ !cancelled() && steps.fingerprint.outputs.same != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FP: ${{ steps.fingerprint.outputs.fp }}
          FINISHED: ${{ steps.count.outputs.finished }}
          HIGH: ${{ steps.count.outputs.high }}
        run: |
          if [ "$FINISHED" = "true" ]; then
            body="$(printf '<!-- chrome-review fp:%s high:%s -->\n### Chrome review of %s\n\n%s\n' "$FP" "$HIGH" "${SHA:0:7}" "$(cat "$OUT/report.md")")"
          else
            body="$(printf '<!-- chrome-review -->\n### Chrome review of %s\n\nThe review did not finish; see the run: %s\n' "${SHA:0:7}" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- chrome-review"))][0].id // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      # The gate: a high-confidence finding fails the check. Medium ones are reported and pass, since the agent is a
      # cheap model reading a diff. A review that did not finish fails too, so a broken run is never a silent pass.
      # An unchanged UI diff answers from the count its review left in the comment.
      - name: Fail on a high-confidence finding
        if: ${{ !cancelled() }}
        env:
          SAME: ${{ steps.fingerprint.outputs.same }}
          REVIEWED_HIGH: ${{ steps.fingerprint.outputs.high }}
          FINISHED: ${{ steps.count.outputs.finished }}
          COUNTED_HIGH: ${{ steps.count.outputs.high }}
        run: |
          if [ "$SAME" = "true" ]; then
            high="$REVIEWED_HIGH"
          elif [ "$FINISHED" = "true" ]; then
            high="$COUNTED_HIGH"
          else
            echo "::error::The review did not finish, or its report names no finding and does not say there are none."; exit 1
          fi
          echo "high $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::The chrome review found $high high-confidence finding(s); the PR comment lists them."; exit 1
          fi
