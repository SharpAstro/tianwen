name: Chrome review

# The chrome-review agent (.claude/agents/chrome-review.md) reads a PR's src/TianWen.UI.* diff for layout arithmetic the
# DIR.Lib engine should own, posts what it found as one comment on the PR, and fails the check when a finding it rates
# high survives. It replaced a Stop hook (.claude/hooks/chrome_review_gate.py, removed 2026-11-19) that asked every
# session to run the agent before finishing: of its 106 asks, 34 ran the agent, about 45 were answered "no layout here"
# or "only the fixes since the last review", and 20, mostly in pilot flight worktrees, were ignored outright and still
# counted as reviewed. Here it runs once per state of the PR that a person is about to merge, whoever wrote it.
#
# Drafts are skipped: a draft is still moving, and every push would be a paid review. Marking a PR ready runs it, and so
# does a later push that changes the UI diff or a chrome test; a newer push cancels a review still running on an older
# one.
#
# What counts as UI is what the hook counted: the .cs and .razor files of the six projects below, not the benchmarks,
# the E2E harness, a shader's .spv or a README beside them. A paths filter reads the whole PR diff against its base, so
# it still starts this workflow on every later push of a PR that touches one of them, a docs fixup or a merge of main
# included. The fingerprint step below is what keeps those from being a second paid review (105k to 165k tokens each,
# docs/plans/viewer-layout-engine.md): it skips the agent when the UI and chrome-test diff is the one already reviewed.
#
# A PR that changes THIS file cannot be reviewed here. The review action will not run a workflow file that differs from
# the default branch's: it logs "Workflow validation failed", ends its step as a success and writes nothing (seen on
# #2307, whose check then read "the review did not finish"). The check says so in words and fails. The way out is a PR
# of its own for the workflow change: one that touches no UI file starts no review at all.
#
# A run can also end before the model answered, and then the action's log holds no reason at all (#2318, run 44812002769
# on #2307: is_error true after 399 ms, one turn, total_cost_usd 0, empty modelUsage). The count step reads those fields
# off the last result of the execution file and, when no tokens were used, says the run ended before the model answered
# (a refused OAuth token or a usage limit on the subscription, not a review of the diff), with the CLI's own text when
# it has any. The execution file is kept as the run artifact chrome-review-execution for 7 days, so the refusal's real
# text can be read when the comment cannot show it.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/TianWen.UI.Abstractions/**/*.cs'
      - 'src/TianWen.UI.Abstractions/**/*.razor'
      - 'src/TianWen.UI.Shared/**/*.cs'
      - 'src/TianWen.UI.Shared/**/*.razor'
      - 'src/TianWen.UI.Gui/**/*.cs'
      - 'src/TianWen.UI.Gui/**/*.razor'
      - 'src/TianWen.UI.FitsViewer/**/*.cs'
      - 'src/TianWen.UI.FitsViewer/**/*.razor'
      - 'src/TianWen.UI.Workbench/**/*.cs'
      - 'src/TianWen.UI.Workbench/**/*.razor'
      - 'src/TianWen.UI.Web/**/*.cs'
      - 'src/TianWen.UI.Web/**/*.razor'

concurrency:
  group: chrome-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Not a draft, and not a fork: a fork's PR has no secrets, and a review is billed to the owner's subscription.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    # Measured locally a review takes one to two minutes (docs/plans/viewer-layout-engine.md); a run past this is stuck.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OUT: chrome-review-out
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The whole history, so the agent can diff against origin/main as it does on a dev box. No LFS and no submodules:
      # it reads source, it builds nothing.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      # The UI diff of this PR against its base, as one short hash: the six UI projects and, since the agent's rule 4
      # reads test seams, the CHROME tests among the changed files of src/TianWen.Lib.Tests, which are the ones that
      # use a TianWen.UI namespace. Not every test file: a fix to a stacking test, in a PR that also touches UI,
      # would then be a second paid review of a diff the agent has nothing to say about, which is what this hash is
      # here to prevent. The paths filter above stays UI-only. The comment a finished review leaves
      # carries the hash it reviewed and the count it found; when this push leaves that diff as it was, the agent is
      # not run again and the gate answers from that count. A review that did not finish leaves no hash, so it is
      # never reused.
      - name: Fingerprint the UI diff
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # The changed test files that use a UI namespace, as they are at the PR's head (a deleted file names nothing
          # to review). Literal paths, so a name with a bracket in it is not read as a pattern.
          chrome_tests=()
          while IFS= read -r file; do
            if grep -qE 'TianWen\.UI\.' "$file" 2>/dev/null; then
              chrome_tests+=(":(literal)$file")
            fi
          done < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- ':(glob)src/TianWen.Lib.Tests/**/*.cs')
          echo "chrome tests in the diff: ${#chrome_tests[@]}"
          fp="$(git diff "$BASE...HEAD" -- \
            ':(glob)src/TianWen.UI.Abstractions/**/*.cs' ':(glob)src/TianWen.UI.Abstractions/**/*.razor' \
            ':(glob)src/TianWen.UI.Shared/**/*.cs' ':(glob)src/TianWen.UI.Shared/**/*.razor' \
            ':(glob)src/TianWen.UI.Gui/**/*.cs' ':(glob)src/TianWen.UI.Gui/**/*.razor' \
            ':(glob)src/TianWen.UI.FitsViewer/**/*.cs' ':(glob)src/TianWen.UI.FitsViewer/**/*.razor' \
            ':(glob)src/TianWen.UI.Workbench/**/*.cs' ':(glob)src/TianWen.UI.Workbench/**/*.razor' \
            ':(glob)src/TianWen.UI.Web/**/*.cs' ':(glob)src/TianWen.UI.Web/**/*.razor' \
            "${chrome_tests[@]}" | sha256sum | cut -c1-16)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          first="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- chrome-review"))][0].body // empty' | head -n 1)"
          reviewed="$(printf '%s' "$first" | sed -n 's/.* fp:\([0-9a-f]\{16\}\) high:\([0-9][0-9]*\) -->.*/\1 \2/p')"
          if [ "${reviewed%% *}" = "$fp" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "high=${reviewed##* }" >> "$GITHUB_OUTPUT"
            echo "The UI diff ($fp) is the one already reviewed; the agent is not run again."
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi
          # Does the PR change this workflow? Three dots: the PR's own changes, not what main changed under it (the
          # workflow that runs is the merge commit's, so a branch that is only behind main still runs main's file).
          if git diff --quiet "$BASE...HEAD" -- .github/workflows/chrome-review.yml; then
            echo "own_workflow=false" >> "$GITHUB_OUTPUT"
          else
            echo "own_workflow=true" >> "$GITHUB_OUTPUT"
            echo "This PR changes .github/workflows/chrome-review.yml; the review action will not run it."
          fi

      - name: Run the chrome-review agent
        id: agent
        if: ${{ steps.fingerprint.outputs.same != 'true' && steps.fingerprint.outputs.own_workflow != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet, as the agent's own frontmatter says: a checklist review does not need the larger model. Read-only
          # tools and the git reads the agent's instructions name; Write only for the report.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,Write,Bash(git fetch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            You are the chrome-review agent. Your instructions are the body of .claude/agents/chrome-review.md (everything
            after its frontmatter): read that file first and follow it exactly. The base to diff against is
            origin/${{ github.event.pull_request.base.ref }}; HEAD is the pull request's head.

            Before you report a finding, open the line it names and the method around it and confirm it holds. Drop any you
            cannot confirm.

            Write one file, and nothing else:
            - ${{ env.OUT }}/report.md: the report in the format the instructions give, each finding with its own
              "confidence: high" or "confidence: medium" line (or the instructions' "No chrome arithmetic in this diff."
              line and the files you read).

      # The counts are read off the report itself, one "confidence:" line per finding. The agent used to write a second
      # file with its own tally, and the gate trusted that alone: a report listing a high finding beside a tally of 0
      # passed, and the reverse failed a clean one. One statement of each finding leaves nothing to disagree.
      - name: Count the findings
        id: count
        if: ${{ !cancelled() && steps.fingerprint.outputs.same != 'true' && steps.fingerprint.outputs.own_workflow != 'true' }}
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          if [ ! -s "$OUT/report.md" ]; then
            # Why there is no report: the agent's own last word, which the action keeps out of the log. When the run
            # never reached the model (a token that is no longer taken, a usage limit) it is the CLI's error, and
            # without it the check only says "did not finish" (#2307's two runs ended in 0.2 s with no reason shown).
            # The action sets its output only on success, so the file is also looked for where it always writes it.
            log="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
            why=""
            noanswer=false
            if [ -s "$log" ]; then
              why="$(jq -r '[.[] | select(.type == "result")] | last | (.result // ((.errors // []) | join("; "))) // ""' "$log" 2>/dev/null \
                | tr '\r\n' '  ' | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//' | cut -c1-300)"
              # A run that cost nothing and used no model never reached the model (#2318: 399 ms, one turn, cost 0,
              # empty modelUsage, is_error true, and nothing in the log). Both fields must be PRESENT and zero/empty: a
              # result that lacks either one is no evidence that no tokens were used, so it never says "no tokens used".
              # jq makes the one zero-cost decision (cost 0 and no model used); the shell only reads its answer. An
              # empty answer means the log could not be read, which is no evidence the run used nothing.
              stats="$(jq -r '[.[] | select(.type == "result")] | last // {} | "\(.num_turns // 0) \(.total_cost_usd // 0) \((.modelUsage // {}) | length) \((has("total_cost_usd") and has("modelUsage") and .total_cost_usd == 0 and (.modelUsage | length) == 0))"' "$log" 2>/dev/null || true)"
              if [ -n "$stats" ]; then
                read -r turns cost models zero <<< "$stats"
                echo "last result: turns $turns, cost $cost, models used $models"
                if [ "$zero" = "true" ]; then
                  noanswer=true
                fi
              else
                echo "could not read the last result's cost fields"
              fi
            fi
            echo "no report; the agent's last word: ${why:-none kept}"
            # The reason says whose words it is here, where that is known: the comment and the check print it as it
            # stands, and the workflow's own reason below would otherwise read as the agent's.
            # The comment names the artifact only when the file exists for the upload step to find.
            if [ -s "$RUNNER_TEMP/claude-execution-output.json" ]; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
            if [ "$noanswer" = "true" ]; then
              echo "why=the run ended before the model answered (${turns:-0} turn(s), no tokens used): a refused OAuth token or a usage limit on the subscription, not a review of the diff${why:+; the CLI said: $why}" >> "$GITHUB_OUTPUT"
            else
              echo "why=${why:+the agent said: $why}" >> "$GITHUB_OUTPUT"
            fi
            echo "finished=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          high="$(grep -Eic '^[[:space:]]*confidence:[[:space:]]*high[[:space:]]*$' "$OUT/report.md" || true)"
          medium="$(grep -Eic '^[[:space:]]*confidence:[[:space:]]*medium[[:space:]]*$' "$OUT/report.md" || true)"
          # Every line with the word in it, however it is dressed (bold, a trailing note, a list item): when that is
          # more than the lines counted above, a finding was written in a form the counts miss, and the report is not
          # trusted. The agent's format has the word on a finding's confidence line and nowhere else, so a report that
          # uses it in a sentence fails here too, with the reason said: closed, not silently open.
          total="$(grep -ic 'confidence' "$OUT/report.md" || true)"
          clean="$(grep -c 'No chrome arithmetic in this diff' "$OUT/report.md" || true)"
          echo "high $high, medium $medium, confidence lines $total, says clean: $clean"
          if [ "$total" -ne $((high + medium)) ]; then
            echo "finished=false" >> "$GITHUB_OUTPUT"
            if [ -s "$RUNNER_TEMP/claude-execution-output.json" ]; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
            echo "why=the report has $total lines that speak of confidence and only $((high + medium)) are a bare 'confidence: high' or 'confidence: medium', so its findings cannot be counted" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A report with no finding and no "nothing found" line says nothing that can be counted.
          if [ "$high" -eq 0 ] && [ "$medium" -eq 0 ] && [ "$clean" -eq 0 ]; then
            if [ -s "$RUNNER_TEMP/claude-execution-output.json" ]; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
            echo "finished=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "finished=true" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"

      # The action's execution file, kept when the review did not finish: its last result holds the CLI's own text for a
      # run that ended before the model answered, which the action's log leaves out (#2318).
      - name: Keep the execution file
        if: ${{ !cancelled() && steps.count.outputs.finished == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: chrome-review-execution
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 7
          if-no-files-found: ignore

      # One comment per PR, edited in place on each run, so a PR does not collect a comment per push. Not on a
      # cancelled run: a push that supersedes a running review would overwrite the comment with "did not finish" for
      # the old commit, and two runs that find no comment yet would each post one. Nor when the diff was not reviewed
      # again: the comment already says what was found in it.
      - name: Post the report on the PR
        if: ${{ !cancelled() && steps.fingerprint.outputs.same != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FP: ${{ steps.fingerprint.outputs.fp }}
          FINISHED: ${{ steps.count.outputs.finished }}
          HIGH: ${{ steps.count.outputs.high }}
          OWN_WORKFLOW: ${{ steps.fingerprint.outputs.own_workflow }}
          WHY: ${{ steps.count.outputs.why }}
          KEPT: ${{ steps.count.outputs.kept }}
        run: |
          if [ "$OWN_WORKFLOW" = "true" ]; then
            body="$(printf '<!-- chrome-review -->\n### Chrome review of %s\n\n%s\n' "${SHA:0:7}" \
              'Not reviewed. This PR changes `.github/workflows/chrome-review.yml`, and the review action will not run a workflow file that differs from the one on the default branch. Put the workflow change in a PR of its own (one that touches no UI file starts no review). Until then this check stays red.')"
          elif [ "$FINISHED" = "true" ]; then
            body="$(printf '<!-- chrome-review fp:%s high:%s -->\n### Chrome review of %s\n\n%s\n' "$FP" "$HIGH" "${SHA:0:7}" "$(cat "$OUT/report.md")")"
          else
            kept=""
            if [ "$KEPT" = "true" ]; then kept=" (the action's execution file is kept there as the artifact chrome-review-execution, for 7 days)"; fi
            body="$(printf '<!-- chrome-review -->\n### Chrome review of %s\n\nThe review did not finish%s; see the run: %s%s\n' "${SHA:0:7}" \
              "${WHY:+ ($WHY)}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$kept")"
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- chrome-review"))][0].id // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      # The gate: a high-confidence finding fails the check. Medium ones are reported and pass, since the agent is a
      # cheap model reading a diff. A review that did not finish fails too, so a broken run is never a silent pass.
      # An unchanged UI diff answers from the count its review left in the comment, and that comes first: a UI diff
      # reviewed before the PR touched this workflow is still the diff that was reviewed. A PR that changes this
      # workflow and has no such review fails with the reason (the header says why it cannot be reviewed).
      - name: Fail on a high-confidence finding
        if: ${{ !cancelled() }}
        env:
          SAME: ${{ steps.fingerprint.outputs.same }}
          OWN_WORKFLOW: ${{ steps.fingerprint.outputs.own_workflow }}
          REVIEWED_HIGH: ${{ steps.fingerprint.outputs.high }}
          FINISHED: ${{ steps.count.outputs.finished }}
          COUNTED_HIGH: ${{ steps.count.outputs.high }}
          WHY: ${{ steps.count.outputs.why }}
        run: |
          if [ "$SAME" = "true" ]; then
            high="$REVIEWED_HIGH"
          elif [ "$OWN_WORKFLOW" = "true" ]; then
            echo "::error::Not reviewed: this PR changes the review's own workflow file, which the review action will not run. Move that change to a PR that touches no UI file."; exit 1
          elif [ "$FINISHED" = "true" ]; then
            high="$COUNTED_HIGH"
          else
            echo "::error::The review did not finish, or its report names no finding and does not say there are none.${WHY:+ Reason: $WHY}"; exit 1
          fi
          echo "high $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::The chrome review found $high high-confidence finding(s); the PR comment lists them."; exit 1
          fi
