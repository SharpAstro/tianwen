name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue or PR at a time; a second request queues behind the first instead of racing it
# on the same branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # A run is a COMMAND, and only the owner gives one: a new comment (or review) by sebgod whose
    # text STARTS with @claude. Three things this used to allow, and why each is gone:
    #   - `issues: opened` / `assigned`. An issue body is data, not a command. On 2026-09-24 about
    #     400 backlog items were migrated into issues by a script running as the owner; their text
    #     quoted "the @claude runner", every such issue started a run, and seven worked unasked
    #     (two opened PRs). To hand Claude an issue, open it, then comment "@claude ...".
    #   - `contains(..., '@claude')`. A quote, a code span or a sentence ABOUT the runner matched.
    #   - OWNER/MEMBER/COLLABORATOR. Anyone with a relationship to the repo could start a paid run;
    #     the login test below admits the owner only. (The action still refuses anyone without write
    #     access, but only after the setup steps have spent cache and LFS bandwidth.)
    # `github.actor` is not used: on these events it is the commenter today, but the comment's own
    # author field says what is meant.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'sebgod' && startsWith(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'sebgod' && startsWith(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'sebgod' && startsWith(github.event.review.body, '@claude'))
    # Bounded like every job in this repo (see dotnet.yml). No measured figure yet: sized for a
    # Release build plus a full TianWen.Lib.Tests run (test-unit's healthy ~6m) with room for the
    # conversation around them, so a run over it is stuck rather than busy.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # No LFS file may reach this job except through the cached pull below. Every GitHub-hosted
    # Ubuntu runner registers git-lfs's smudge filter system-wide (its Debian package runs
    # `git lfs install --system`), and actions/checkout suppresses it only for its OWN commands
    # (it sets this same variable while `lfs: false`). So when the action checked out a PR's head
    # for a comment on that PR, every LFS file the PR changed came straight from LFS, past the
    # cache and never saved to it, again on every mention. With the smudge skipped job-wide those
    # stay pointer stubs: a PR that changes an LFS file cannot be built here, which is the honest
    # answer while its files are not cached. `git lfs pull` ignores the variable (checked
    # 2026-09-25 on a file:// clone: a pointer checked out with it set, pulled with it still set,
    # came back as the full file), so the cached set below still arrives whole.
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # The steps up to the action give Claude the same environment test-unit has, so it can BUILD
      # and TEST what it changes rather than only read and edit. Nothing is built here: a mention
      # that only asks a question should not pay for a build, so Claude runs dotnet itself when it
      # needs to (allowed in claude_args below).
      #
      # Depth 1 is enough: the action deepens a PR branch to 20 commits itself. The OpenNGC
      # submodule is a build input (the catalog preprocess reads it). Checkout comes first
      # because the two setup steps are composites in this repo.
      #
      # persist-credentials: false, or Claude cannot PUSH (#302). checkout v6+ keeps its token in a
      # file pulled in through includeIf.gitdir, which claude-code-action's credential cleanup does
      # not look at (anthropics/claude-code-action#1721), so the workflow's read-only token beat the
      # app token and the #294 run's push was refused as github-actions[bot]. Nothing persisted,
      # nothing to beat. It holds because this repo is PUBLIC: the action fetches once before it
      # configures its own auth, anonymously, which fails on a private repo (#1236); nothing up to
      # the action needs the token (the submodule comes with the checkout, public LFS is anonymous).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: false
          persist-credentials: false
      # test-unit's own step, so the GPU comp tests run on lavapipe here too and the apt cache is
      # shared rather than duplicated.
      - name: Install unit-test system packages
        uses: ./.github/actions/unit-test-deps
      # LFS is not optional even for a build: the catalog .lz files are PreprocessCatalogs' input,
      # and a pointer stub in their place fails it. Same set and prefix as test-unit, so a mention
      # normally rides the entry main's CI saved and transfers nothing: the LFS budget ran dry once
      # already (2026-08-17), and a cold pull per mention would spend it again.
      - name: Fetch required LFS objects
        uses: ./.github/actions/lfs-pull
        with:
          include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
          cache-prefix: lfs-tests
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # No NuGet cache: dotnet.yml's build job says why (a 1.3 GB entry per pin bump
          # crowds the lfs-* entries out of the 10 GB repo cache).

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # The model is pinned: left unset the action picks its own default, which was Sonnet on
          # every run through 2026-09-20.
          #
          # dotnet restore/build/test only: enough to verify a change, and `dotnet run` stays out.
          # `gh pr create` so a finished run opens its PR instead of leaving a compare link for a
          # human to click. `pwsh tools/bake-icons.ps1` because the icon table is
          # a generated file with one sanctioned generator, and the bake is byte-reproducible on
          # any host (the script's own remarks).
          # The appended prompt carries the one fact CLAUDE.md states for a dev box and not for
          # this runner: with no sibling clones beside the repo every SharpAstro library is a
          # nuget.org PACKAGE, built Release, so a Debug build of the solution fails with CS0234
          # on the #if DEBUG inspector namespaces and reads like a broken package.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(gh pr create:*),Bash(pwsh tools/bake-icons.ps1:*)"
            --append-system-prompt "This runner has none of the SharpAstro sibling repos checked out, so every SharpAstro library resolves as a nuget.org package, exactly as in CI. Run dotnet from src/ and build the solution with -c Release: a Debug solution build fails with CS0234 on DIR.Lib.Diagnostics because a published package is built Release. The LFS objects the tests need are already pulled. A full TianWen.Lib.Tests run takes several minutes here, so prefer a --filter run for the area you changed. When the change is finished and its tests pass, push the branch and open the pull request yourself with gh pr create against main, linking the issue that asked for it."
