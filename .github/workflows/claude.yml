name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # The @claude text is the trigger; the author_association test keeps a stranger's mention on
    # this PUBLIC repo from starting a run at all. The action's own check is the real gate (it
    # refuses anyone without write access), but it runs AFTER the setup steps below, so without
    # this every drive-by mention would restore ~200 MiB of cache and, on a miss, spend LFS
    # bandwidth before being refused. An association is a relationship, not a permission (a MEMBER
    # can have read access only), which is why it only PREFILTERS. `assigned` needs no test:
    # assigning an issue already takes triage access, and the association on that event is the
    # issue AUTHOR's, not the assigner's, so testing it would block assigning Claude to a
    # stranger's issue.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && (github.event.action == 'assigned' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    # Bounded like every job in this repo (see dotnet.yml). No measured figure yet: sized for a
    # Release build plus a full TianWen.Lib.Tests run (test-unit's healthy ~6m) with room for the
    # conversation around them, so a run over it is stuck rather than busy.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # The steps up to the action give Claude the same environment test-unit has, so it can BUILD
      # and TEST what it changes rather than only read and edit. Nothing is built here: a mention
      # that only asks a question should not pay for a build, so Claude runs dotnet itself when it
      # needs to (allowed in claude_args below).
      #
      # Depth 1 is enough: the action deepens a PR branch to 20 commits itself. The OpenNGC
      # submodule is a build input (the catalog preprocess reads it). Checkout comes first
      # because the two setup steps are composites in this repo.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: false
      # test-unit's own step, so the GPU comp tests run on lavapipe here too and the apt cache is
      # shared rather than duplicated.
      - name: Install unit-test system packages
        uses: ./.github/actions/unit-test-deps
      # LFS is not optional even for a build: the catalog .lz files are PreprocessCatalogs' input,
      # and a pointer stub in their place fails it. Same set and prefix as test-unit, so a mention
      # normally rides the entry main's CI saved and transfers nothing: the LFS budget ran dry once
      # already (2026-08-17), and a cold pull per mention would spend it again.
      - name: Fetch required LFS objects
        uses: ./.github/actions/lfs-pull
        with:
          include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
          cache-prefix: lfs-tests
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # dotnet restore/build/test only: enough to verify a change, and `dotnet run` stays out.
          # The appended prompt carries the one fact CLAUDE.md states for a dev box and not for
          # this runner: with no sibling clones beside the repo every SharpAstro library is a
          # nuget.org PACKAGE, built Release, so a Debug build of the solution fails with CS0234
          # on the #if DEBUG inspector namespaces and reads like a broken package.
          claude_args: |
            --allowedTools "Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*)"
            --append-system-prompt "This runner has none of the SharpAstro sibling repos checked out, so every SharpAstro library resolves as a nuget.org package, exactly as in CI. Run dotnet from src/ and build the solution with -c Release: a Debug solution build fails with CS0234 on DIR.Lib.Diagnostics because a published package is built Release. The LFS objects the tests need are already pulled. A full TianWen.Lib.Tests run takes several minutes here, so prefer a --filter run for the area you changed."
