name: pages

# Deploy the TianWen.UI.Web in-browser planner to GitHub Pages.
#
# TianWen.UI.Web is a standalone Blazor WebAssembly app hosting PlannerTab<WebGlContext>
# (WebGl.Renderer) - a fully static site, no server. It publishes to
# https://sharpastro.github.io/tianwen/. Design + findings: docs/plans/web-showcase.md.
# It lives OUTSIDE TianWen.slnx, so `dotnet build` on the solution never touches it; dotnet.yml's
# build job compiles it explicitly on every push and PR, but only the QUICK interpreted way. This
# workflow is still the only thing that AOTs it, trims it, bakes its assets or deploys it, so an AOT
# or trimming regression is visible here and nowhere else.
# It IS under the repo's Central Package Management, despite the above: CPM resolves by walking
# directories, so solution membership never had any bearing on it. While the project opted out,
# its inline WebGl.Renderer pin was invisible to a sibling-family sweep and fell two minors behind.
#
# Two deploy-only concerns handled here (neither applies to local dev on :5099):
#  - Mono WASM AOT (RunAOTCompilation=true): measured 24-42x on the catalog init + planner
#    sweep - the interpreted build is unshippable. ubuntu-x64 runs the mainstream AOT
#    toolchain, so no WasmDedup=false / extra interpret-excludes beyond the csproj's
#    P/Invoke-dense vendor SDKs (those crash the WIN-ARM64 cross-compiler; see the csproj).
#  - Comet asset bake: JPL sends no CORS headers from EITHER host it serves comets from, so
#    the app can never fetch them from a browser origin and BOTH are baked here as same-origin
#    static assets; AddAstrometry(cometQueryUri:, apparitionSeedUri:) points the UNCHANGED
#    source/parser/cache stack at them. See the step itself for what it does and why it is
#    incremental - it is the one place that should describe it.
#
# NOTE: Pages must be enabled once with build type "workflow" (Settings -> Pages ->
# Source: "GitHub Actions", or `gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow`).

on:
  push:
    branches: [main]
    paths:
      - 'src/TianWen.UI.Web/**'
      - 'src/TianWen.UI.Abstractions/**'
      - 'src/TianWen.Lib/**'
      # The dependency pins decide WHICH WebGl.Renderer / DIR.Lib the deployed app is built from, so a
      # sibling bump changes the shipped site without touching a single path above. That is not
      # hypothetical: the bump to WebGl.Renderer 1.25 existed to remove ~5.6% of the browser's
      # main-thread time (a discarded pointermove crossing per touch move) and, listing only source
      # directories, this workflow did not run for it. The fix was merged and not deployed, which is
      # the worst of both: green CI, unchanged site, and nothing saying so.
      - 'src/Directory.Packages.props'
      - 'src/Directory.Build.props'
      # The bake tools decide what the site SERVES, which makes them as load-bearing as the source
      # directories above and subject to exactly the same failure: change a tool alone, get green CI,
      # an unchanged site, and nothing saying so. bake-comets writes the two JPL assets the app cannot
      # fetch cross-origin; bake-tycho2 writes the star atlas the sky map loads. Neither is reachable
      # from any path listed above, because neither is referenced by the web project -- they are run
      # BY this workflow, which is precisely why only this workflow can notice them.
      - 'tools/bake-comets/**'
      - 'tools/bake-tycho2/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Weekly redeploy to re-bake the comet assets: orbit solutions update on new observation
    # arcs (the app-side SBDB cache TTL is also 7 days), and the apparition overlay's per-run
    # fetch cap means a cold start drains its backlog over several runs rather than one.
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45   # mono AOT wasm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # Catalog .lz sources, prebaked .bin.gz snapshots, and the wwwroot .ttf font are git-LFS
      # objects; without this pull the checkout leaves pointer text and the managed lzip
      # preprocess fails ("Invalid lzip magic bytes" - the first deploy run's failure) or, worse,
      # pointer text gets embedded/served. Narrow include + object cache mirrors dotnet.yml
      # (skips the ~120 MB of test fixtures a full LFS pull would drag in).
      - name: Compute LFS cache key
        id: lfs-key
        run: |
          # Same include set AND same key prefix as dotnet.yml's build job, deliberately: caches
          # are repo-scoped, so this restores the entry dotnet.yml already populated from main
          # instead of storing a byte-identical duplicate.
          HASH=$(git ls-files '*.lz' '*.ttf' '*.bin.gz' | xargs cat | sha256sum | cut -c1-16)
          echo "key=lfs-build-${HASH}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.lfs-key.outputs.key }}
          # A changed key restores the newest previous object set so the pull fetches
          # only the delta (see the dotnet.yml cache steps for the 2026-08-17 incident
          # this guards against).
          restore-keys: |
            lfs-build-
      - name: Fetch required LFS objects
        run: git lfs pull --include="*.lz,*.ttf,*.bin.gz"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # AOT compilation (and the Release relink) need the Emscripten/LLVM toolchain.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Bake the comet assets BEFORE publish so they ride the static-web-assets pipeline.
      #
      # JPL sends no CORS headers from EITHER host it serves comets from, so BOTH have to be baked:
      # the bulk SBDB query (comets-sbdb.json) and the per-object Horizons current-apparition overlay
      # (comets-apparitions.json). Baking only the first is what left the deployed atlas retrying a
      # request that could never succeed -- 45 attempts and 50 s of request time for a single comet in
      # one four-minute session. The overlay is written sealed, so the browser does not try at all.
      #
      # This runs our own code rather than curl+jq because both halves need it: staleness is
      # CometElements.IsElementSetStale and the Horizons reply needs HorizonsCometSource's parser. It
      # also takes the SBDB query string from SbdbCometSource.DefaultQueryUrl instead of restating it
      # here, which is one fewer pair of things that have to agree.
      #
      # --seed is the CURRENTLY DEPLOYED overlay, which makes the published site its own incremental
      # state: only entries past their per-comet TTL are re-resolved (~30 requests on a day that
      # deploys, against ~520 for a full bake). A 404 on the first ever run is a cold bake, which the
      # cap turns into "as much as fits, the rest next run" rather than a stall.
      - name: Bake comet assets (JPL sends no CORS headers, for SBDB or Horizons)
        run: |
          set -euo pipefail
          # No --nologo here: dotnet run forwards it PAST the -- separator to the app, whose parser
          # rightly rejects an unknown argument (exit 2). DOTNET_NOLOGO is set in env: anyway.
          dotnet run --project tools/bake-comets/BakeComets.csproj -c Release -- \
            --out src/TianWen.UI.Web/wwwroot \
            --seed https://sharpastro.github.io/tianwen/comets-apparitions.json \
            --max-fetches 120

      # Stage the full Tycho-2 catalog as same-origin static assets. Lightweight strips the ~30 MB
      # tyc2.bin.lz from the WASM bundle (keeps the bundle small); the atlas fetches it on first open
      # and decodes it in-browser (web-tycho2.md). The .lz source is an LFS object pulled above.
      #
      # TWO shapes are staged, and both are wanted:
      #   tyc2.bin.lz   the whole catalog, one request. Still the fallback, and what a client uses
      #                 when it wants everything.
      #   tyc2/*.lz     166 region-aligned members + a manifest, so a view fetches only the sky it
      #                 is looking at: a 10-degree field costs 9 files / 1.40 MiB against 28.7 MiB.
      #
      # The members are DERIVED from the same .lz, not baked from the upstream catalog, so they
      # cannot drift into disagreeing about the sky; bake-tycho2 verifies the concatenated members
      # decode back to the identical bytes and refuses to write if they do not.
      #
      # These are FILES rather than byte ranges of the one asset because ranges are unusable on both
      # candidate hosts: GitHub Pages answers 206 over the GZIP representation (Fastly compresses
      # every content type, and Accept-Encoding is a forbidden header so no browser can ask for
      # identity), and Cloudflare Pages ignores Range outright. Do NOT re-test this with curl and
      # conclude otherwise -- curl's default headers are exactly what hides it.
      - name: Stage Tycho-2 for the Sky Atlas (whole catalog + region-aligned members)
        run: |
          set -euo pipefail
          src="src/TianWen.Lib/Astrometry/Catalogs/tyc2.bin.lz"
          # Guard against a stale LFS pointer sneaking through (a pointer is <200 bytes of text).
          [ "$(stat -c%s "$src")" -gt 1000000 ] || { echo "tyc2.bin.lz looks like an LFS pointer, not the object"; exit 1; }
          cp "$src" src/TianWen.UI.Web/wwwroot/tyc2.bin.lz
          echo "staged tyc2.bin.lz ($(du -h src/TianWen.UI.Web/wwwroot/tyc2.bin.lz | cut -f1))"
          # No --nologo: dotnet run forwards an unrecognised flag to the APP, which rightly rejects
          # it (exit 2). DOTNET_NOLOGO is set in env: anyway. Same trap as the bake-comets run.
          dotnet run --project tools/bake-tycho2/BakeTycho2.csproj -c Release -- \
            "$src" src/TianWen.UI.Web/wwwroot/tyc2
          echo "staged $(ls src/TianWen.UI.Web/wwwroot/tyc2 | wc -l) member files"

      # No sibling checkouts in CI: WebGl.Renderer + DIR.Lib resolve from NuGet
      # (UseLocalSiblings=false). Lightweight strips the 30 MB tyc2 catalog; AOT is the
      # measured 24-42x compute win (docs/plans/web-showcase.md).
      - name: Publish TianWen.UI.Web (Release, Lightweight, AOT)
        run: dotnet publish src/TianWen.UI.Web/TianWen.UI.Web.csproj -c Release -o publish -p:UseLocalSiblings=false -p:Lightweight=true -p:RunAOTCompilation=true --nologo

      - name: Rewrite base href for the /tianwen/ project-site subpath
        run: |
          set -euo pipefail
          idx="publish/wwwroot/index.html"
          # github.io serves this project site under /tianwen/, not root. Local dev
          # keeps <base href="/" />; patch only the published copy.
          sed -i 's|<base href="/" />|<base href="/tianwen/" />|' "$idx"
          grep -q '<base href="/tianwen/" />' "$idx" || { echo "base href not rewritten"; exit 1; }

      - name: SPA 404 fallback + .nojekyll
        run: |
          set -euo pipefail
          # Jekyll strips _framework/ (leading underscore) - .nojekyll disables Jekyll.
          touch publish/wwwroot/.nojekyll
          # Static hosts 404 on client-side deep links; GitHub Pages serves 404.html
          # for unknown paths, so a copy of index.html makes routes resolve.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
