# Checks that docs/plans, the GitHub issues and the per-plan milestones agree (tools/plan-issue-report.py,
# no model involved): an issue linking a plan section that no longer exists, a closed milestone still
# holding open issues, a plan with open issues and no milestone. What each finding means:
# .claude/skills/plan-report/SKILL.md.
#
# On a PR that touches the plans it fails only on an ERROR about a plan THAT PR changed, so a heading renamed
# there cannot leave an issue's link dead (eight were, on 2026-09-28, each from a heading that carried a status
# or a date which then changed). An error anywhere else is another piece of work's and is listed in the summary
# without failing this PR: #1065 went red on a dead link in an issue another session had just opened. Weekly
# and on demand it only reports; the issues and milestones are the shared view, and nothing waits on this run.
name: plan-report

on:
  pull_request:
    paths:
      - 'docs/plans/**'
      - 'tools/plan-issue-report.py'
      - '.github/workflows/plan-report.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  plan-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check plans against issues and milestones
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          out=(--html plan-report.html --json plan-report.json --markdown plan-report.md)
          if [ "$EVENT" = "pull_request" ]; then
            # The plans this PR changed, by file stem: only an ERROR about one of them fails the PR.
            mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD" -- 'docs/plans/*.md' | xargs -r -n1 basename | sed 's/\.md$//')
            python3 tools/plan-issue-report.py "${out[@]}" --strict-plans "${changed[@]}"
          else
            python3 tools/plan-issue-report.py "${out[@]}"
          fi

      - name: Job summary
        if: always()
        run: if [ -f plan-report.md ]; then cat plan-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-report
          path: |
            plan-report.html
            plan-report.json
          if-no-files-found: ignore
