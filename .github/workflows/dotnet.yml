name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # main's merge queue: the PR rebased onto main with the PRs queued ahead of it. The queue BUILDS that commit and
  # tests nothing: the tests ran on the PR and run again on the push to main, as ever. What only the queue sees is two
  # PRs that each build alone and not together (2026-10-20: the ring buffer change and the background extractor, the
  # same minute), and the build is what breaks then; the suites' 25 minutes per merge, their flaky legs throwing a
  # PR out of the queue and their LFS fixtures were not worth one such break in nine days. Its gate job is the check
  # main's ruleset requires.
  merge_group:
  # publish-apps + release are gated on workflow_dispatch only -- LFS bandwidth
  # makes it too expensive to publish all six AOT RIDs on every push to main.
  # Trigger via the /release-tianwen skill (gh workflow run dotnet.yml).
  workflow_dispatch:

env:
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The version is CAPTURED from `dotnet msbuild -getProperty` stdout in build's "Resolve version
  # prefix" step, so the SDK's first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1
  # The LFS set the apps are built from, stated once: build pulls it and packs it into the
  # lfs-payload artifact, publish-apps asserts every file in it arrived. Those were three
  # spellings of one list, and an object the payload misses reaches every release asset as a
  # pointer stub. The test jobs pull their own, wider sets.
  APP_LFS_INCLUDE: '*.lz,*.ttf,*.bin.gz,*.onnx'

jobs:
  # What every other job starts from: the version and whether the tests run at all. Its own job so that the test jobs
  # need nothing from build and start beside it (#2054): they waited about 5 min for build to finish, and then built
  # again themselves, so build's whole length sat on the required path ahead of the 15 min of tests. It costs one short
  # runner start ahead of build, which is no longer on that path.
  plan:
    # Every job in this repo is bounded. GitHub's default is SIX HOURS, and that is not a
    # theoretical ceiling: an unreachable apt archive parked a sibling repo's job on it for a whole
    # morning on 2026-08-19, and a hung step gates everything downstream of it while burning runner
    # minutes. Healthy durations are noted per job; the limits are generous multiples of them, so a
    # job over its limit is stuck rather than slow. publish-apps has no measured figure (it only
    # runs on workflow_dispatch and none is recent), so its bound is a guess sized to catch a hang
    # rather than to be tight.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # Published for the downstream jobs. $GITHUB_ENV is PER-JOB, so the `echo >> $GITHUB_ENV` step
    # that single-job repos use (Lzip.Lib, the reference implementation) would set VERSION_PREFIX
    # for this job only and leave test-unit / test-functional / publish-apps / release with an empty
    # value -- silently malforming `-p:Version=` and tagging a release `v.`. A job output crosses
    # the boundary; each consumer maps it back to the same env name, so no `run:` line changes.
    # build passes both on as its own outputs, so the jobs after it read them where they always did.
    outputs:
      version-prefix: ${{ steps.resolve-version.outputs.prefix }}
      tested-on-pr: ${{ steps.tested-on-pr.outputs.tested-on-pr }}
    # The repo's default token is read-only for contents alone; the tested-on-pr step below also reads
    # the PR a pushed commit came from and that PR's workflow runs. Stated per job, so no other job gains
    # anything.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        lfs: false
    # A push to main whose tree a passing PR run already tested skips test-unit and test-functional
    # (#1287). A PR is rebased onto main just before it is pushed, so the tree a rebase merge lands is
    # usually the very tree the PR's own run tested (#1282 to #1285 all were), and testing it again was a
    # second full run of both suites per merged PR on shared hosted runners. "Up to date with main" is not
    # enforced, so that is CHECKED, not assumed: the merged PR this commit came from, its head's tree
    # against the pushed tree, and that PR's own CI/CD run. Only identical trees AND a run that passed
    # skip the tests; no PR, an API error, another tree (main moved under the PR: #1275's merge) or a run
    # not green runs them as before. The PR run tested the merge of its head with main as main was then,
    # which is the head's own tree whenever the head was up to date, and an out-of-date head cannot land
    # on main with that same tree. A pull_request run and a workflow_dispatch release always test.
    - name: Was this tree already tested on its PR
      id: tested-on-pr
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tested=false
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] | "\(.number) \(.head.sha)"' 2>/dev/null || true)
          if [ -n "$pr" ] && [ "$pr" != "null null" ]; then
            number=${pr%% *}
            head=${pr##* }
            pushed=$(git rev-parse "$GITHUB_SHA^{tree}")
            headTree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha 2>/dev/null || true)
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dotnet.yml/runs?event=pull_request&head_sha=$head" \
              --jq '.workflow_runs[0] | "\(.id) \(.conclusion)"' 2>/dev/null || true)
            echo "PR #$number, head $head: its tree $headTree, the pushed tree $pushed; its CI/CD run ${run:-not found}"
            if [ -n "$headTree" ] && [ "$pushed" = "$headTree" ] && [ "${run##* }" = success ]; then
              tested=true
            fi
          else
            echo "no merged PR into main for $GITHUB_SHA"
          fi
        fi
        echo "tested-on-pr=$tested"
        echo "tested-on-pr=$tested" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # Read the major.minor back from the ONE place it is written (src/Directory.Build.props ->
    # VersionMajorMinor) instead of restating it in this file. It used to be a literal in the
    # workflow `env:`, so the number lived in two places and nothing compared them.
    #
    # -getProperty only EVALUATES the file: nothing is built and no restore is needed. The value is
    # CAPTURED from stdout, so nothing else may print to it: DOTNET_NOLOGO (workflow env) keeps the SDK
    # first-run banner out, and the shape check makes anything unexpected, or a renamed property, FAIL
    # the run rather than quietly stamping every package and the release tag as ".<run>". Written to
    # $GITHUB_OUTPUT for the downstream jobs, since $GITHUB_ENV does not cross a job boundary.
    - name: Resolve version prefix
      id: resolve-version
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo | tr -d '[:space:]')"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "Resolved VERSION_PREFIX=${MM}.${{ github.run_number }}"

  build:
    timeout-minutes: 20   # healthy 3m18s
    needs: plan
    runs-on: ubuntu-latest
    env:
      VERSION_PREFIX: ${{ needs.plan.outputs.version-prefix }}
    # plan's two answers, passed on: publish-nuget, release, gate and the packaging jobs read them here.
    outputs:
      version-prefix: ${{ needs.plan.outputs.version-prefix }}
      tested-on-pr: ${{ needs.plan.outputs.tested-on-pr }}
    permissions:
      contents: read
    steps:
    # The PreprocessCatalogs MSBuild target produces the *.gs.gz embedded
    # resources from *.json.lz / *.csv.lz sources, decoding the .lz inputs with
    # the managed lzip decoder (Lzip.Lib) and writing the .gs.gz output via .NET
    # GZipStream -- no external `lzip` binary is needed. *.gs.gz is gitignored,
    # so a fresh checkout regenerates it during build.
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Narrow LFS pull: build needs catalog .lz (TianWen.Lib EmbeddedResource),
    # milkyway .lz (Gui Content), fonts .ttf (Gui Content), the prebaked
    # snapshot .bin.gz files (TianWen.Lib EmbeddedResource - if missing, the
    # LFS pointer text gets embedded and runtime gzip read fails), and the
    # in-repo AI model weights .onnx (TianWen.AI.Imaging Content, copied to
    # every consuming app's output + publish dir). Skipping test fixtures
    # (*.fits.gz) saves ~120 MB per pull -- they're only needed by the test
    # jobs, not for compilation or the .nupkg artifact.
    #
    # The .onnx is a real object in this glob again since 2026-09-06, when the LFS budget
    # came back and the `.gitattributes` exemption that had made the weights a plain git
    # blob was removed. It must stay in APP_LFS_INCLUDE, which feeds the payload packed below as
    # well: the publish matrix never touches LFS, so anything missing from the payload reaches a
    # released binary as a 130-byte pointer stub that ModelResolver then refuses.
    #
    # The cache key, the restore-keys delta and why they matter: .github/actions/lfs-pull.
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: ${{ env.APP_LFS_INCLUDE }}
        cache-prefix: lfs-build
    # PreprocessCatalogs' outputs from a cache keyed on its sources: about 38 s of serial pwsh ahead of TianWen.Lib's
    # compile otherwise. The action says why an exact key alone is restored.
    - name: Restore the preprocessed catalogs
      uses: ./.github/actions/catalog-cache
    # Hand the materialised files to the publish matrix as an artifact so those legs never
    # touch LFS at all. They used to restore the lfs-build- cache this job saves, which a
    # Windows runner cannot read (actions/cache segregates Windows from POSIX entries unless
    # enableCrossOsArchive is set), so both Windows legs always fell through to a live
    # `git lfs pull` -- merely costly while the LFS budget held, fatal once it ran dry.
    # Artifacts cross OSes freely, so the publish legs stop depending on the budget at all.
    #
    # Tar rather than handing upload-artifact a path list: it roots paths at their least
    # common ancestor, which would flatten src/TianWen.Lib/... and src/TianWen.UI.Gui/...
    # into one tree. The tar keeps repo-relative paths, so a leg unpacks it over its own
    # checkout and every file lands where the csproj expects it.
    #
    # *.onnx is IN the payload: the AI model weights are `Content` on TianWen.AI.Imaging, so
    # they flow into every consuming app's publish dir. While they were a plain git blob the
    # checkout carried them and this list did not need them; now that they are an LFS object
    # again, leaving them out would ship a pointer stub as the model file in every release
    # asset -- a failure that looks like a broken model at runtime, not like a broken build.
    # The list is APP_LFS_INCLUDE, the set the pull above fetched, so the two cannot differ.
    - name: Package LFS payload for the publish matrix
      run: |
        IFS=',' read -ra globs <<< "$APP_LFS_INCLUDE"
        git ls-files -- "${globs[@]}" > lfs-payload.list
        tar -czf lfs-payload.tar.gz -T lfs-payload.list
        echo "packaged $(wc -l < lfs-payload.list) files, $(du -h lfs-payload.tar.gz | cut -f1)"
    - uses: actions/upload-artifact@v7
      with:
        name: lfs-payload
        path: lfs-payload.tar.gz
        if-no-files-found: error
        retention-days: 1
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet caching OFF on every job now, for the reason the publish legs give below. The entry
        # is 1.3 GB and keyed on Directory.Packages.props, so every pin bump saved one on its PR ref
        # and a second on main: on 2026-09-25 the repo cache held 11.2 GB against its 10 GB budget,
        # 10.5 of it NuGet, and least-recently-used eviction was one bad day from taking the lfs-*
        # entries. With the LFS budget spent, a job whose LFS cache misses cannot pull and FAILS
        # (#775 did), so those entries are what keeps CI green. A nuget.org restore is free and
        # cannot refuse.
    # The baked icon table is generated from src/TianWen.UI.Abstractions/icons.recipe and committed. The
    # build already warns (TWIC0001) when the recipe is NEWER than the table, but a timestamp only ever
    # catches a forgotten re-bake -- it cannot see a table that was hand-edited, or one committed from a
    # different font. Re-baking and comparing can, because the bake is byte-reproducible:
    # ManagedFontRasterizer is pure managed, so the same recipe and font give identical output on any
    # host. Runs before restore because it needs neither the solution nor its packages, only `dnx`.
    #
    # Fails the run rather than warning: unlike a stale-timestamp warning this cannot fire spuriously --
    # a mismatch means the committed table does not correspond to the recipe beside it, and the marks
    # that ship would not be the ones the recipe describes.
    - name: Verify the baked icon table matches its recipe
      run: pwsh tools/bake-icons.ps1 -Verify
    # The sky mark's stars are a SECOND recipe, because `sizes` is per-recipe and they need a ladder
    # down to 2 px that the toolbar's marks have no use for. Verified separately for the same reason
    # the first one is: a hand-edited table would ship marks the recipe does not describe.
    - name: Verify the baked sky-icon table matches its recipe
      run: pwsh tools/bake-icons.ps1 -Recipe src/TianWen.UI.Abstractions/sky-icons.recipe -Verify
    # The cheap half of the MSIX lane, deliberately here rather than only in the msix job: that
    # job is dispatch-only, and a packaging lane first exercised while cutting a release is one
    # discovered to be broken at the worst moment. This validates the manifest is well-formed XML,
    # that every logo it names exists at the size its name claims, and that the version rules hold
    # (four parts, none over 65535, revision 0). No publish, no packing, about a second.
    - name: Validate the MSIX manifest and assets
      run: pwsh packaging/windows/msix/build-msix.ps1 -ValidateOnly
    # The macOS lane's equivalent: both Info.plist templates parse once the version is substituted,
    # the entitlements parse and grant no JIT, the icon extractor finds a PNG frame in both .ico
    # files, and the script passes bash -n. Needs nothing from macOS, so it runs here on ubuntu.
    - name: Validate the macOS bundle templates and assets
      run: bash packaging/macos/build-dmg.sh --validate-only
    - name: Restore dependencies
      run: dotnet restore -p:Configuration=$BUILD_CONF
      working-directory: src
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src
    # Share the preprocessed catalog .gs.gz files with the test + publish jobs so
    # they skip re-running PreprocessCatalogs (and the catalog LFS pull), esp.
    # publish-apps on its cross-platform matrix. Downstream jobs download into the
    # same path and rely on file mtime > *.json.lz mtime to skip the target.
    - name: Upload preprocessed catalogs
      uses: actions/upload-artifact@v7
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/*.gs.gz
        retention-days: 1
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5
    # TianWen.UI.Web is IN TianWen.slnx, so the Build step above already compiled it; only the E2E
    # harness lives outside (IsTestProject + Playwright, so a solution-wide dotnet test would sweep a
    # suite needing a browser and a served app). An API change in TianWen.UI.Abstractions, or a sibling
    # pin bump that moves WebGl.Renderer, used to reach pages.yml AFTER merge as a broken deploy.
    # This is the QUICK build: interpreted, no AOT and no native relink, so it needs no wasm-tools
    # workload, and it compiles against the libraries this job has already built. That is what makes
    # it affordable on every push and PR (~1 min) rather than the deploy's full AOT publish.
    #
    # Placed after the uploads so a web-only break still leaves the catalog + package artifacts
    # behind, and three details are deliberate, each because the alternative costs a FULL rebuild of
    # TianWen.Lib (catalog resources and all) instead of reusing the Build step above:
    #  - The version properties are repeated verbatim from Build. A different -p:Version regenerates
    #    AssemblyInfo for every project in the graph -- and TianWen.Lib sets GeneratePackageOnBuild,
    #    so a rebuild here at a DIFFERENT version would also drop a second, stray .nupkg beside the
    #    real one (the org-wide trap in ../.github/CLAUDE.md, which --skip-duplicate then hides).
    #  - No -p:Lightweight=true, even though the deploy passes it. It only REMOVES an EmbeddedResource
    #    from TianWen.Lib, so it changes no C# and no razor -- there is nothing extra to cover -- but
    #    it does change Lib's inputs.
    #  - No --no-restore: the solution restore never saw this project, so it restores here.
    #
    # What this CANNOT catch, and pages.yml still owns: the AOT leg (the mono cross-compiler
    # fail-fasts on the vendor SDK assemblies TianWen.UI.Web works around), trimming, and anything at
    # runtime. The E2E suite is COMPILED here but not RUN -- it needs a browser and a served app.
    - name: Build TianWen.UI.Web.E2E (compiled, not run)
      run: |
        dotnet build TianWen.UI.Web.E2E/TianWen.UI.Web.E2E.csproj -c $BUILD_CONF -p:UseLocalSiblings=false -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src

  # The Linux test projects, BUILT ONCE per runner, as build-windows builds the Windows ones (#2054), and run by every
  # shard of that runner. Each test job used to build what it tested and then run the whole suite: the x64 unit job
  # built for 3 to 5 minutes and tested for 21.5 (run 42804689190), and nothing short of sharding could take that under
  # 10. A shard that built for itself would spend half its 10 minutes compiling, so the shards unpack this job's bin
  # folders instead. Two legs, a matrix since both finish within seconds of each other: x64 builds the unit, GPU and
  # functional projects in one job (they share everything but the test assemblies), ARM64 the unit and GPU ones.
  #
  # Not build's own build of the test projects, though build compiles them too: round 4's first run (42900071837) took
  # the x64 shards' bins from build, whose whole-solution compile WITH analyzers (as it must) ran 4m47s and ended 6.3
  # minutes into the run, where this job's analyzer-free build ended 4 minutes in on ARM64.
  #
  # Only the projects tested, never the solution: build compiles the whole solution already. No package either:
  # TianWen.Lib packs on build, and nothing here uploads it. And no analyzers nor XML documentation, which only report
  # (build runs both over the same sources on every run, so a warning they raise is still raised). They were half the
  # compile: a full rebuild of TianWen.Lib.Tests and everything under it took 3m50s with them and 1m55s without, on one
  # machine back to back (#2054); TianWen.Lib (IsAotCompatible, so the trim and AOT analyzers) and TianWen.Cli (PublishAot)
  # are the longest projects ahead of every shard. Source generators still run: RunAnalyzers=false makes the compiler skip
  # the analyzers only (/skipanalyzers), and a missing generator would fail this build.
  build-linux:
    timeout-minutes: 15   # 3m36s on ARM64 without analyzers and with the catalogs cached (run 42900071837)
    needs: plan
    # Not again on a push to main whose tree its PR's passing run already tested (plan's tested-on-pr), nor in the
    # merge queue, which only builds (see merge_group above).
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    env:
      VERSION_PREFIX: ${{ needs.plan.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, projects: 'TianWen.Lib.Tests TianWen.Lib.Tests.Gpu TianWen.Lib.Tests.Functional' }
          - { runner: ubuntu-24.04-arm, projects: 'TianWen.Lib.Tests TianWen.Lib.Tests.Gpu' }
    name: build-linux (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Narrow LFS pull: tests need catalogs (.lz), fonts (.ttf), FITS test fixtures (.fits.gz) embedded in
    # TianWen.Lib.Tests.dll, and the in-repo AI model weights (.onnx) so N2nDenoiserTests' cross-language parity test
    # runs instead of skipping. `*.CR2`/`*.cr2` cover Cr2ImportTests (Data/CR2/*, ~19 MB), `*.CR3`/`*.cr3`
    # Cr3ImportTests (Data/CR3/*, ~7 MB); both case variants are tracked in .gitattributes, so a future lowercase
    # fixture does not silently skip. The prefix is shared by every test job on purpose: their sets overlap almost
    # entirely, so any one's saved entry is a near-complete starting point for the others (cache mechanics:
    # .github/actions/lfs-pull).
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
        cache-prefix: lfs-tests
    - name: Restore the preprocessed catalogs
      uses: ./.github/actions/catalog-cache
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # No NuGet cache: the build job's setup-dotnet says why.
    - name: Restore dependencies
      run: for p in ${{ matrix.projects }}; do dotnet restore $p -p:Configuration=$BUILD_CONF || exit 1; done
      working-directory: src
    - name: Build
      run: |
        props="-c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:RunAnalyzers=false -p:GenerateDocumentationFile=false"
        for p in ${{ matrix.projects }}; do dotnet build $p $props || exit 1; done
      working-directory: src
    # A tar per suite with repo-relative paths, for the reason build's LFS payload gives: upload-artifact roots a path list
    # at its common ancestor. The shards unpack it over their own checkout, where `dotnet test --no-build` finds it. zstd
    # on every core, not gzip: the unit build is 475 MB packed, and gzip took 29 s of the job for it (run 42885521250).
    - name: Pack the test builds
      run: |
        tar -I 'zstd -T0 -3' -cf tests-bin-unit.tar.zst src/TianWen.Lib.Tests/bin/$BUILD_CONF src/TianWen.Lib.Tests.Gpu/bin/$BUILD_CONF
        if [ -d src/TianWen.Lib.Tests.Functional/bin/$BUILD_CONF ]; then
          tar -I 'zstd -T0 -3' -cf tests-bin-functional.tar.zst src/TianWen.Lib.Tests.Functional/bin/$BUILD_CONF
        fi
        du -h tests-bin-*.tar.zst
    - name: Upload the unit test build
      uses: actions/upload-artifact@v7
      with:
        name: tests-bin-${{ matrix.runner }}-unit
        path: tests-bin-unit.tar.zst
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload the functional test build
      if: matrix.runner == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: tests-bin-ubuntu-latest-functional
        path: tests-bin-functional.tar.zst
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  # The unit suite on Linux, x86_64 and ARM64, sharded by class so each job stays under 10 minutes (#2054):
  # .github/test-shards.json says which classes each shard takes, the same split as test-windows', and its last shard
  # takes everything the others did not, so a new class always runs. The matrix's `of` must agree with that file or the
  # test step fails. `fail-fast: false` so a regression on one shard does not cancel the others. The GPU suite runs on
  # the last shard of each architecture, after its unit tests.
  #
  # The job names changed with the sharding ("test-unit (ubuntu-latest 1/4)"); that is safe because the ONE check
  # main's ruleset requires is gate, and a required check is matched by name. Four shards, not round 3's five, once the
  # slow tests' causes were cut and the shards balanced by their longest chain (test-shards.json says how): fewer jobs
  # against the org's 20 at once, which is what kept round 3's shards waiting for a runner.
  test-unit:
    timeout-minutes: 15   # each shard is meant to stay under 10 minutes
    needs: [plan, build-linux]
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
        shard: [ 1, 2, 3, 4 ]
        of: [ 4 ]
    name: test-unit (${{ matrix.runner }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ${{ matrix.runner }}
    steps:
    # Checkout comes FIRST: the two setup steps below are composites in this repo, which only exist once it is on disk.
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Fonts, the lavapipe software-Vulkan stack and lldb (for the "Symbolicate crash dump" step below). The list and
    # why each package is there: .github/actions/unit-test-deps.
    - name: Install unit-test system packages
      uses: ./.github/actions/unit-test-deps
    # build-linux's set, which is what the build embedded or copied (see there).
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
        cache-prefix: lfs-tests
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: |
        dotnet restore TianWen.Lib.Tests -p:Configuration=$BUILD_CONF
        dotnet restore TianWen.Lib.Tests.Gpu -p:Configuration=$BUILD_CONF
      working-directory: src
    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: tests-bin-${{ matrix.runner }}-unit
    - name: Unpack the build
      run: tar -I zstd -xf tests-bin-unit.tar.zst && rm tests-bin-unit.tar.zst
    - name: Unit Tests
      # --output Detailed surfaces ITestOutputHelper messages for Skip+Pass tests too, not just Fail, and prints each
      # test's time, which is what tools/ci-test-timings.py reads.
      #
      # --crashdump + --hangdump + --crash-sequence capture a <app>_<hash>_crash.sequence.log (tab separated STARTED /
      # ENDED lines, written AS THE RUN GOES, so a hang leaves one too) and a *.dmp under test-results/: the
      # Microsoft.Testing.Platform equivalents of VSTest's --blame-crash / --blame-hang (on MTP the --blame-* flags do
      # not exist, so a stale copy fails with 'Unknown option'). The hang timeout fires when a single test stalls
      # > 5 min, which catches the "tests finished but the process lingered then crashed" pattern of run 26022912901 on
      # the arm runner. DOTNET_DbgEnableMiniDump is belt-and-suspenders: the runtime writes its own minidump on any
      # fatal event, not just the crash the platform detects (Type 2 = heap + threads).
      #
      # The shard's filter carries "Category!=Heavy" (test-shards.json): the tests that take 30 s or more on this
      # runner are heavy-tests.yml's, nightly (the owner, 2026-10-10). A test is tagged by MEASUREMENT on a green x64
      # run, never by guess. The platform exits 8 when a shard ran no test, so an empty shard fails.
      env:
        DOTNET_DbgEnableMiniDump: "1"
        DOTNET_DbgMiniDumpType: "2"
        DOTNET_DbgMiniDumpName: /tmp/coredump-%e-%p-%t.dmp
      shell: pwsh
      run: |
        $filter = & ../.github/scripts/test-shard-filter.ps1 -Project TianWen.Lib.Tests -Shard ${{ matrix.shard }} -Of ${{ matrix.of }}
        "filter: $filter"
        dotnet test TianWen.Lib.Tests -c $env:BUILD_CONF --no-build --filter $filter --output Detailed --crashdump --hangdump --hangdump-timeout 5min --crash-sequence on --results-directory test-results/
        exit $LASTEXITCODE
      working-directory: src
    - name: GPU Tests
      # Every test that drives a real GPU (here lavapipe), in a process of its own (#1634): a fault inside a GPU driver
      # cannot be caught in .NET and ends the process it happens in, so it ends this step, never the unit suite. For the
      # same reason it runs whatever the unit tests did. No Heavy filter: nothing here is Heavy, and heavy-tests.yml
      # does not run this project, so a filter would drop such a test from every run.
      if: ${{ !cancelled() && matrix.shard == matrix.of }}
      env:
        DOTNET_DbgEnableMiniDump: "1"
        DOTNET_DbgMiniDumpType: "2"
        DOTNET_DbgMiniDumpName: /tmp/coredump-%e-%p-%t.dmp
      run: dotnet test TianWen.Lib.Tests.Gpu -c $BUILD_CONF --no-build --output Detailed --crashdump --hangdump --hangdump-timeout 5min --crash-sequence on --results-directory test-results-gpu/
      working-directory: src
    # A green run leaves nothing under the tests' temp folder (#2035): a test removes its own output when it ends, so this
    # lists what is still there and fails naming it. After the last test step, on success only (default `if`).
    - name: No test temp output left behind
      uses: ./.github/actions/test-temp-leftovers
    # On a native test-process crash (SIGSEGV -> exit 139), symbolicate the runtime minidump HERE, on the same runner,
    # while the crashed process's shared libraries are still on disk: lldb loads those .so from their recorded paths, so
    # the backtrace names the culprit (e.g. the lavapipe .so) in this run's log. The offline analyze-crash-dump workflow
    # only gets bare addresses. Best-effort + capped: never let analysis failure mask the real test failure.
    - name: Symbolicate crash dump (native stacks)
      if: failure()
      run: |
        set +e
        shopt -s nullglob
        dumps=(/tmp/coredump-*.dmp)
        if [ ${#dumps[@]} -eq 0 ]; then
          echo "no runtime minidump (/tmp/coredump-*.dmp) -- the failure was not a native crash"
          exit 0
        fi
        for d in "${dumps[@]}"; do
          echo "==== lldb backtrace ($d, $(du -h "$d" | cut -f1)) ===="
          lldb --batch -c "$d" \
            -o "thread backtrace all" \
            -o "image list" \
            -o "quit" 2>&1 | head -c 500000
          echo "(lldb exit $?)"
        done
    # Test temp output (cpu.tiff / gpu.tiff / diff.tiff) of GpuStretchPipelineTests on a failure, so a CPU/GPU divergence
    # can be diagnosed without a re-run. A test's output folder is <name>_<random> and is removed when the test ends
    # (#2035), so this finds files only where a run set TIANWEN_KEEP_TEST_OUTPUT=1.
    - name: Upload GPU stretch test output on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: gpu-stretch-test-output-${{ matrix.runner }}-${{ matrix.shard }}
        path: /tmp/TianWen.Lib.Tests/*/GpuStretchPipelineTests_*/
        if-no-files-found: ignore
        retention-days: 7
    # The --crashdump / --hangdump artifacts and runtime minidumps: the *_crash.sequence.log names the tests that were
    # running when it died (STARTED with no ENDED); the *.dmp files load in `dotnet-dump analyze` or lldb.
    - name: Upload test-blame + crash dumps on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-blame-${{ matrix.runner }}-${{ matrix.shard }}
        path: |
          src/test-results/
          src/test-results-gpu/
          /tmp/coredump-*.dmp
        if-no-files-found: ignore
        retention-days: 14

  # DEBUG-gated suites. Some instrumentation is compiled out of Release, so the Release shards SKIP the tests that cover
  # it and are no cover at all. ChannelBufferLeakTracker (P2 of docs/plans/frame-lifecycle.md) is the first of these: its
  # tests open with Assert.SkipUnless(ChannelBufferLeakTracker.IsActive), which is the honest report for a Release run but
  # would otherwise leave the feature verified nowhere. Selected by TRAIT, never by a list of class names, so a future
  # DEBUG-gated suite is picked up by adding [Trait("Category", "DebugOnly")].
  #
  # Its own job, beside build-linux rather than after it, since it needs a different CONFIGURATION of the same sources
  # and builds it itself (4 to 5 min). One architecture, deliberately: the DebugOnly tests are arch-independent. It
  # builds TianWen.Lib.Tests alone, never the solution in Debug: CI resolves siblings as PACKAGES, a published package
  # is built Release, so the #if DEBUG types the debug-inspector layer consumes are absent from it (CS0234 on
  # DIR.Lib.Diagnostics and its counterparts). The name is the leg's old one.
  test-unit-debug:
    timeout-minutes: 15   # 4 to 6 min
    needs: plan
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    env:
      VERSION_PREFIX: ${{ needs.plan.outputs.version-prefix }}
    name: test-unit (debug)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    - name: Install unit-test system packages
      uses: ./.github/actions/unit-test-deps
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
        cache-prefix: lfs-tests
    - name: Restore the preprocessed catalogs
      uses: ./.github/actions/catalog-cache
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore TianWen.Lib.Tests -p:Configuration=Debug
      working-directory: src
    # Same version properties as the Release builds, and GeneratePackageOnBuild off: TianWen.Lib packs on build, and a
    # Debug pack would drop a second .nupkg beside the Release one (the shape that has bitten sibling repos). No analyzers
    # nor documentation, for build-linux's reason.
    - name: Build (Debug, for the DEBUG-gated suites)
      run: dotnet build TianWen.Lib.Tests -c Debug --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:RunAnalyzers=false -p:GenerateDocumentationFile=false
      working-directory: src
    # The guard is not optional: a renamed or mistyped trait would otherwise turn this job into a green no-op, the same
    # vacuous pass the SkipUnless exists to prevent, one level up. --minimum-expected-tests is the platform's own
    # enforcement (exit code 8 when fewer ran). The TRX is written for the failure artifact.
    - name: Unit Tests (DEBUG-gated instrumentation)
      run: |
        dotnet test TianWen.Lib.Tests -c Debug --no-build --filter "Category=DebugOnly" \
          --output Detailed --report-trx --report-trx-filename debug-only.trx \
          --minimum-expected-tests 1 \
          --results-directory test-results-debug/
      working-directory: src
    - name: No test temp output left behind
      uses: ./.github/actions/test-temp-leftovers
    - name: Upload the test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-blame-debug
        path: src/test-results-debug/
        if-no-files-found: ignore
        retention-days: 14

  # The functional suite on Linux x64, sharded as test-unit is (#2054), from build-linux's x64 build.
  test-functional:
    timeout-minutes: 15   # each shard is meant to stay under 10 minutes; unsharded, the suite tested for 8 min
    needs: [plan, build-linux]
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
        of: [ 3 ]
    name: test-functional (${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    steps:
    # astrometry-data-2mass-08-19 alone is ~1 GB. Caching saves ~30-60s and a fair chunk of network on every run.
    - uses: SharpAstro/cache-apt-pkgs-action@v1
      with:
        packages: astrometry.net astrometry-data-2mass-08-19
        version: 1.0
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: '*.lz,*.ttf,*.bin.gz,*.fits.gz'
        cache-prefix: lfs-tests
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore TianWen.Lib.Tests.Functional -p:Configuration=$BUILD_CONF
      working-directory: src
    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: tests-bin-ubuntu-latest-functional
    - name: Unpack the build
      run: tar -I zstd -xf tests-bin-functional.tar.zst && rm tests-bin-functional.tar.zst
    # --output Detailed prints each test's time, which is what a slow suite is ranked by (#2054).
    - name: Functional Tests
      shell: pwsh
      run: |
        $filter = & ../.github/scripts/test-shard-filter.ps1 -Project TianWen.Lib.Tests.Functional -Shard ${{ matrix.shard }} -Of ${{ matrix.of }}
        "filter: $filter"
        dotnet test TianWen.Lib.Tests.Functional -c $env:BUILD_CONF --no-build --filter $filter --output Detailed --crashdump --hangdump --hangdump-timeout 5min --results-directory test-results/
        exit $LASTEXITCODE
      working-directory: src
    # Nothing left under the tests' temp folder after a green run (#2035); the same step as test-unit's.
    - name: No test temp output left behind
      uses: ./.github/actions/test-temp-leftovers
    - name: Upload crash and hang dumps on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-blame-functional-${{ matrix.shard }}
        path: src/test-results/
        if-no-files-found: ignore
        retention-days: 14

  # The unit and functional suites on Windows (#2054), where tianwen is mostly used and where its Windows-only
  # behaviour (the 15.6 ms timer, file locks, process trees, temp folders) used to be exercised by no job at all.
  # Sharded by class so each leg stays under 10 minutes: .github/test-shards.json says which classes each shard
  # takes, its last shard takes everything the others did not (so a new class always runs), and the
  # matrix's `of` must agree with that file or the test step fails. The GPU suite stays on Linux: a hosted
  # Windows runner has no Vulkan device.
  #
  # Set up for speed the way publish-apps is: Defender's real-time scan in-lines every file write, so it is
  # switched off (and the workspace, temp and NuGet folders excluded, should switching it off be refused)
  # before checkout lands a file. LFS comes from the same lfs-tests cache entries the Linux jobs save, which a
  # Windows runner can read since lfs-pull sets enableCrossOsArchive, never from a live pull. NuGet comes from a
  # Windows-only cache that only main SAVES (nuget-cache-windows below), so it costs one entry per change of the
  # package set, not one per PR: the budget note on build's setup-dotnet is why the Linux jobs cache nothing.
  #
  # The two test projects are BUILT ONCE, here, and every shard runs that build (#2054). Each shard built them itself
  # at first, and the build was 3 to 5 minutes of every shard's 7 to 14 (run 42804689190): no shard could stay under 10
  # minutes with it, and the slowest two did not. It also kept the build's MSBuild and compiler servers, and their
  # memory, resident on the machine the tests then ran on. A shard restores its project (the NuGet cache makes that
  # seconds) and unpacks the bin folder over its checkout, so `dotnet test --no-build` finds it where it was built.
  # Both suites in ONE job: they share everything but the two test assemblies, so the second is a short incremental
  # build. Split into a leg per suite (round 3 of #2054, run 42885521250) each compiled TianWen.Lib for itself, the legs
  # took 7m04s and 7m28s against 6m01s for both in one job, and a matrix's dependants wait for every leg anyway. No
  # analyzers nor documentation, and the catalogs from their cache, for build-linux's reasons: TianWen.Lib compiled
  # for 2m44s and TianWen.Cli for 1m26s of that run's 5m37s build, behind 30 s of catalog preprocessing.
  build-windows:
    timeout-minutes: 15   # 6m01s for both suites in one job, with analyzers (run 42814136317)
    needs: plan
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    env:
      VERSION_PREFIX: ${{ needs.plan.outputs.version-prefix }}
    runs-on: windows-latest
    steps:
    - name: Defender off for the workspace, temp and NuGet
      shell: pwsh
      run: |
        $nuget = Join-Path $env:RUNNER_TEMP 'nuget-packages'
        "NUGET_PACKAGES=$nuget" >> $env:GITHUB_ENV
        Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\AppData\Local\Temp", $nuget, "$env:USERPROFILE\.nuget", "$env:ProgramFiles\dotnet"
        try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Warning "real-time scanning stays on, the exclusions hold: $_" }
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # The unit suite's set, a superset of the functional suite's: what either build embeds or copies to the output.
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx'
        cache-prefix: lfs-tests
    - name: Restore the preprocessed catalogs
      uses: ./.github/actions/catalog-cache
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore the NuGet cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\nuget-packages
        key: nuget-windows-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/Directory.Build.props', 'src/*.targets', 'src/**/*.csproj') }}
        restore-keys: |
          nuget-windows-
    - name: Restore dependencies
      run: |
        dotnet restore TianWen.Lib.Tests -p:Configuration=$env:BUILD_CONF
        dotnet restore TianWen.Lib.Tests.Functional -p:Configuration=$env:BUILD_CONF
      working-directory: src
    - name: Build
      run: |
        $props = '-c', $env:BUILD_CONF, '--no-restore', "-p:Version=$env:VERSION_PREFIX$env:VERSION_REV$env:VERSION_HASH", "-p:FileVersion=$env:VERSION_PREFIX.$env:VERSION_REV", '-p:ContinuousIntegrationBuild=true', '-p:GeneratePackageOnBuild=false', '-p:RunAnalyzers=false', '-p:GenerateDocumentationFile=false'
        dotnet build TianWen.Lib.Tests @props
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build TianWen.Lib.Tests.Functional @props
        exit $LASTEXITCODE
      working-directory: src
    # A tar of each suite's bin folder, with repo-relative paths, for the reason build's LFS payload gives: upload-artifact
    # roots a path list at its common ancestor. One artifact per suite, so a shard downloads only the suite it runs. The
    # two at once, since each gzip holds one core (the unit one alone took 23 s).
    - name: Pack the test builds
      shell: pwsh
      run: |
        $packs = @(
          Start-Process tar -ArgumentList '-czf', 'windows-unit-bin.tgz', 'src/TianWen.Lib.Tests/bin/Release' -NoNewWindow -PassThru
          Start-Process tar -ArgumentList '-czf', 'windows-functional-bin.tgz', 'src/TianWen.Lib.Tests.Functional/bin/Release' -NoNewWindow -PassThru
        )
        # Read the handle now: a Process from Start-Process that is first asked for its handle after it exited reports no ExitCode.
        $packs | ForEach-Object { $null = $_.Handle }
        $packs | ForEach-Object { $_.WaitForExit() }
        if ($packs | Where-Object ExitCode -ne 0) { throw "tar failed: $($packs.ExitCode)" }
        Get-Item windows-*-bin.tgz | ForEach-Object { "{0} {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
    - name: Upload the unit test build
      uses: actions/upload-artifact@v7
      with:
        name: windows-unit-bin
        path: windows-unit-bin.tgz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload the functional test build
      uses: actions/upload-artifact@v7
      with:
        name: windows-functional-bin
        path: windows-functional-bin.tgz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  test-windows:
    timeout-minutes: 15   # each shard is meant to stay under 10 minutes
    needs: [plan, build-windows]
    # Not again on a push of a tree its PR tested, nor in the merge queue: as test-unit.
    if: needs.plan.outputs.tested-on-pr != 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, project: TianWen.Lib.Tests, shard: 1, of: 4 }
          - { suite: unit, project: TianWen.Lib.Tests, shard: 2, of: 4 }
          - { suite: unit, project: TianWen.Lib.Tests, shard: 3, of: 4 }
          - { suite: unit, project: TianWen.Lib.Tests, shard: 4, of: 4 }
          - { suite: functional, project: TianWen.Lib.Tests.Functional, shard: 1, of: 3 }
          - { suite: functional, project: TianWen.Lib.Tests.Functional, shard: 2, of: 3 }
          - { suite: functional, project: TianWen.Lib.Tests.Functional, shard: 3, of: 3 }
    name: test-windows (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: windows-latest
    steps:
    # Inline, not a composite in this repo: a local action exists only once checkout has run, and this step must
    # come before it.
    - name: Defender off for the workspace, temp and NuGet
      shell: pwsh
      run: |
        $nuget = Join-Path $env:RUNNER_TEMP 'nuget-packages'
        "NUGET_PACKAGES=$nuget" >> $env:GITHUB_ENV
        Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\AppData\Local\Temp", $nuget, "$env:USERPROFILE\.nuget", "$env:ProgramFiles\dotnet"
        try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Warning "real-time scanning stays on, the exclusions hold: $_" }
        Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, AntivirusEnabled
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # The unit suite's set is test-unit's, the functional suite's test-functional's; both share its prefix.
    - name: Fetch required LFS objects
      uses: ./.github/actions/lfs-pull
      with:
        include: ${{ matrix.suite == 'unit' && '*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx' || '*.lz,*.ttf,*.bin.gz,*.fits.gz' }}
        cache-prefix: lfs-tests
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # Restore only: a PR never saves this entry (see the job's note). A key that moved (a pin bump) restores the
    # newest older entry, so the restore fetches only what changed.
    - name: Restore the NuGet cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\nuget-packages
        key: nuget-windows-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/Directory.Build.props', 'src/*.targets', 'src/**/*.csproj') }}
        restore-keys: |
          nuget-windows-
    - name: Restore dependencies
      run: dotnet restore ${{ matrix.project }} -p:Configuration=$env:BUILD_CONF
      working-directory: src
    # build-windows' build of this suite, unpacked where it was built (its job says why it is not built here).
    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: windows-${{ matrix.suite }}-bin
    - name: Unpack the build
      shell: pwsh
      run: |
        tar -xzf windows-${{ matrix.suite }}-bin.tgz
        Remove-Item windows-${{ matrix.suite }}-bin.tgz
    # What else holds the machine as the tests start: a shard that stalls (run 42804689190's functional 3/3 had 1.5 s GC
    # pauses and a starved thread pool in its first three minutes, and none on Linux or on a 4-core local run) is read
    # against this, never guessed at.
    - name: The machine as the tests start
      shell: pwsh
      run: |
        $os = Get-CimInstance Win32_OperatingSystem
        "free memory {0:N1} of {1:N1} GB, {2} logical processors" -f ($os.FreePhysicalMemory / 1MB), ($os.TotalVisibleMemorySize / 1MB), [Environment]::ProcessorCount
        Get-Process | Sort-Object CPU -Descending | Select-Object -First 8 Name, Id, @{ n = 'CPU s'; e = { [int]$_.CPU } }, @{ n = 'WS MB'; e = { [int]($_.WorkingSet64 / 1MB) } } | Format-Table -AutoSize
    # The TRX is kept on every run, not only a failed one: it holds each test's time, which is what the Windows vs
    # Linux per-class table is read from. The platform exits 8 when a shard ran no test, so an empty shard fails.
    - name: Tests
      shell: pwsh
      run: |
        $filter = & ../.github/scripts/test-shard-filter.ps1 -Project ${{ matrix.project }} -Shard ${{ matrix.shard }} -Of ${{ matrix.of }}
        "filter: $filter"
        dotnet test ${{ matrix.project }} -c $env:BUILD_CONF --no-build --filter $filter --output Detailed --report-trx --report-trx-filename "windows-${{ matrix.suite }}-${{ matrix.shard }}.trx" --crashdump --hangdump --hangdump-timeout 5min --results-directory test-results/
        exit $LASTEXITCODE
      working-directory: src
    - name: Upload the TRX
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-windows-trx-${{ matrix.suite }}-${{ matrix.shard }}
        path: src/test-results/*.trx
        if-no-files-found: ignore
        retention-days: 14
    - name: Upload crash and hang dumps on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-windows-blame-${{ matrix.suite }}-${{ matrix.shard }}
        path: |
          src/test-results/
          !src/test-results/*.trx
        if-no-files-found: ignore
        retention-days: 14

  # The one job that SAVES test-windows' NuGet cache, on a push to main and only when main's package set has no
  # entry yet: a pin bump costs one entry (about the size of the two test projects' package closure), which a PR
  # then restores. Its key must be test-windows' to the character, path included, since the path is part of an
  # entry's version.
  nuget-cache-windows:
    timeout-minutes: 15
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
    - name: Defender off for the workspace, temp and NuGet
      shell: pwsh
      run: |
        $nuget = Join-Path $env:RUNNER_TEMP 'nuget-packages'
        "NUGET_PACKAGES=$nuget" >> $env:GITHUB_ENV
        Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\AppData\Local\Temp", $nuget, "$env:USERPROFILE\.nuget", "$env:ProgramFiles\dotnet"
        try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Warning "real-time scanning stays on, the exclusions hold: $_" }
    - uses: actions/checkout@v7
      with:
        lfs: false
    - name: Is main's package set cached already
      id: lookup
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\nuget-packages
        key: nuget-windows-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/Directory.Build.props', 'src/*.targets', 'src/**/*.csproj') }}
        lookup-only: true
    - uses: actions/setup-dotnet@v6
      if: steps.lookup.outputs.cache-hit != 'true'
      with:
        dotnet-version: 10.0.x
    - name: Restore what test-windows builds
      if: steps.lookup.outputs.cache-hit != 'true'
      run: |
        dotnet restore TianWen.Lib.Tests -p:Configuration=$env:BUILD_CONF
        dotnet restore TianWen.Lib.Tests.Functional -p:Configuration=$env:BUILD_CONF
      working-directory: src
    - name: Save the NuGet cache
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}\nuget-packages
        key: ${{ steps.lookup.outputs.cache-primary-key }}

  # publish-apps runs in parallel with the test jobs -- dotnet publish is long
  # on AOT targets (multiple minutes per RID), so gating on tests would block
  # the matrix unnecessarily. The `release` job below re-gates: binaries only
  # become a published GitHub Release when both tests AND this matrix succeed.
  #
  # Trigger: workflow_dispatch only (six AOT publishes pull LFS six times,
  # which used to blow through the 1 GB/month free tier on every push to main).
  # Use the /release-tianwen skill to invoke a release.
  publish-apps:
    timeout-minutes: 90   # six AOT RIDs; NOT measured, see the note above
    needs: build
    if: github.event_name == 'workflow_dispatch'
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    # Defender real-time scanning in-lines every file write; on the compile-heavy
    # AOT publish legs (ILC + MSVC link churn thousands of objects) that made the
    # two Windows legs the slowest in the matrix (~6.5-7 min vs ~4-5 min Linux on
    # identical work) -- and the release job gates on the whole matrix, so the
    # Windows legs ARE the release wall time. Excluding the workspace + temp +
    # NuGet cache BEFORE checkout lands any files is the cheap, well-known fix.
    - name: Exclude work dirs from Defender (Windows CI speedup)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:USERPROFILE\.nuget"
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # These legs do NOT touch LFS. The build job materialises the same set (catalogs .lz for
    # TianWen.Lib EmbeddedResource, fonts + milkyway texture for TianWen.UI.Gui Content) and
    # hands it over as the lfs-payload artifact. No FITS fixtures -- publish never builds the
    # test projects.
    #
    # Why not the lfs-build- cache this used to restore: actions/cache segregates Windows from
    # POSIX entries unless enableCrossOsArchive is set, so the two Windows legs could not read
    # the entry the ubuntu build job saves -- not by key, not by the restore-keys prefix -- and
    # always fell through to a live `git lfs pull`. That merely cost bandwidth while the budget
    # held, then failed outright once it ran dry: release run #1311 computed the SAME key on all
    # six legs, all four POSIX legs hit it, and both Windows legs reported "Cache not found".
    # They could not bootstrap an entry of their own either, since actions/cache saves only when
    # the job succeeds and this one could not get that far.
    #
    # The .onnx is back IN the payload as of 2026-09-06 (the LFS budget returned, so the
    # `.gitattributes` exemption that had made it a plain git blob is gone). It was already in
    # the verify step below throughout, which is what made that flip safe to perform: its absence
    # is SILENT otherwise -- a ~130-byte pointer is a valid file, Content copies it into the
    # release tarball's models/ dir, and the binary looks complete while ModelResolver refuses the
    # stub, so `--ai-backend n2n` would go missing from a release with nothing saying so.
    - name: Download LFS payload
      uses: actions/download-artifact@v8
      with:
        name: lfs-payload
    - name: Unpack LFS payload
      shell: bash
      run: |
        tar -xzf lfs-payload.tar.gz
        rm lfs-payload.tar.gz
    # An unmaterialised pointer does not fail anything on its own -- it is a valid ~130-byte
    # text file, so Content copies it into the tarball, EmbeddedResource embeds it, and the
    # release looks complete while the feature it backs is quietly missing. This is the only
    # job whose output ships, so it is the one that must refuse to proceed on a stub. Assert
    # here rather than at the end: the AOT matrix is the expensive part of a release, and
    # there is no reason to spend six legs of it on a build that cannot ship.
    - name: Verify LFS objects materialised
      shell: bash
      run: |
        stubs=0
        IFS=',' read -ra globs <<< "$APP_LFS_INCLUDE"
        for f in $(git ls-files -- "${globs[@]}"); do
          if [ "$(head -c 23 "$f")" = "version https://git-lfs" ]; then
            echo "::error file=$f::still a Git LFS pointer after the pull, so it would ship as a stub"
            stubs=$((stubs + 1))
          fi
        done
        [ "$stubs" -eq 0 ] || exit 1
        echo "all LFS objects materialised"
    # Same artifact pattern as the test jobs -- avoids re-running the
    # preprocess-catalog.ps1 script on the multi-platform publish matrix
    # (Windows / Linux / macOS).
    - name: Download preprocessed catalogs
      uses: actions/download-artifact@v8
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/
    # Touch via PowerShell so the same step works on Windows + Linux + macOS;
    # `touch` (POSIX) is unavailable on the Windows runner.
    - name: Refresh preprocessed catalog mtimes
      shell: pwsh
      run: |
        Get-ChildItem -Path src/TianWen.Lib/Astrometry/Catalogs/ -Filter *.gs.gz |
          ForEach-Object { $_.LastWriteTime = Get-Date }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet caching deliberately OFF here, as on the push/PR jobs since 2026-09-25 (the build
        # job's note says why they followed). This job only runs on
        # workflow_dispatch, so the cache it saves is paid for on every pin change and collected
        # almost never -- and setup-dotnet keys per OS, so these legs were the ONLY source of the
        # Windows and macOS entries (1.4 GB per pin bump) while every push/PR job runs on Linux.
        # A miss costs a nuget.org restore, which is free and cannot refuse; the repo cache budget
        # is 10 GB and the lfs-* entries in it are the ones whose miss actually fails a build.
    # The four binaries below are native-AOT, so the entire package graph is statically linked into
    # each executable and those licences have to travel with it. src/Directory.Build.targets attaches
    # LICENSE / LICENSE.EXCEPTION / NOTICE / THIRD-PARTY-NOTICES.txt / astap-readme.txt to the publish
    # output of anything with PublishAot, so the files must be correct BEFORE the publishes run.
    #
    # Regenerated per matrix leg rather than trusting the committed copy, because the graph is
    # platform-sensitive: the ONNX Runtime execution-provider package is chosen by host OS and RID
    # (DirectML on Windows, .Gpu.Linux for linux-x64, the plain CPU package otherwise), so a file
    # generated on one platform names packages another does not link and omits ones it does. Doing it
    # here is what gets each tarball its own accurate notices. The committed copy still matters: it is
    # what a local publish uses, and Content items that point at a missing file fail the publish.
    #
    # The explicit restore is only because the script reads obj/project.assets.json, which restore is
    # what writes; the publishes below would otherwise restore implicitly. It is cache-backed, so the
    # cost is small.
    - name: Restore publishable projects for this RID
      run: |
        for p in TianWen.Cli TianWen.UI.FitsViewer TianWen.UI.Gui TianWen.Server; do
          dotnet restore "src/$p/$p.csproj" -r ${{ matrix.rid }} -p:Configuration=Release
        done
      shell: bash
    - name: Generate third-party notices for this platform
      run: ./tools/generate-third-party-notices.ps1
      shell: pwsh
    - name: Publish TianWen.Cli
      run: dotnet publish src/TianWen.Cli/TianWen.Cli.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    - name: Publish TianWen.UI.FitsViewer
      run: dotnet publish src/TianWen.UI.FitsViewer/TianWen.UI.FitsViewer.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    # The Explorer thumbnail provider (a NativeAOT COM DLL, ~3 MB) ships INSIDE the viewer's tree: the
    # MSIX manifest names it by a package-relative path and the tarball's `--register` looks for it
    # beside the exe, so copying it here is what puts it in both the Store package and the release
    # asset with no further step. Windows only, it is a shell extension. Its dependency graph is a
    # subset of the viewer's, so the notices generated above already cover it.
    - name: Publish TianWen.Shell.Thumbnails into the viewer tree
      if: startsWith(matrix.rid, 'win-')
      run: |
        dotnet publish src/TianWen.Shell.Thumbnails/TianWen.Shell.Thumbnails.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
        cp src/TianWen.Shell.Thumbnails/bin/Release/net10.0/${{ matrix.rid }}/publish/tianwen-thumb.dll src/TianWen.UI.FitsViewer/bin/Release/net10.0/${{ matrix.rid }}/publish/
      shell: bash
    - name: Publish TianWen.UI.Gui
      run: dotnet publish src/TianWen.UI.Gui/TianWen.UI.Gui.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    - name: Publish TianWen.Server
      run: dotnet publish src/TianWen.Server/TianWen.Server.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    # The rig is this computer's node's (P6 of docs/plans/hardware-in-the-server.md, #936): the GUI and the CLI find or
    # start tianwen-server from their OWN directory, so an archive of either without it cannot touch a device.
    # src/ExeBeside.targets publishes it beside them, and tianwen-ascomhost beside it on Windows; this fails the leg
    # rather than shipping an archive that lost one.
    - name: Verify tianwen-server ships beside the GUI and the CLI
      run: |
        ext=""
        case "${{ matrix.rid }}" in win-*) ext=".exe" ;; esac
        for app in TianWen.Cli TianWen.UI.Gui; do
          dir="src/$app/bin/Release/net10.0/${{ matrix.rid }}/publish"
          test -f "$dir/tianwen-server$ext" || { echo "::error::$app's publish has no tianwen-server$ext"; exit 1; }
          case "${{ matrix.rid }}" in
            win-*) test -f "$dir/tianwen-ascomhost.exe" || { echo "::error::$app's publish has no tianwen-ascomhost.exe"; exit 1; } ;;
          esac
        done
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-cli-${{ matrix.rid }}
        path: src/TianWen.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-fits-${{ matrix.rid }}
        path: src/TianWen.UI.FitsViewer/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-gui-${{ matrix.rid }}
        path: src/TianWen.UI.Gui/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-server-${{ matrix.rid }}
        path: src/TianWen.Server/bin/Release/net10.0/${{ matrix.rid }}/publish/

  # The Microsoft Store package for the FITS viewer, shipped as Astro Photo Viewer.
  #
  # Deliberately NOT gated on the tests, unlike release: this produces an artifact for a human to
  # upload, not something that reaches a user by itself, and the Store runs its own certification
  # on top. It is gated on publish-apps because it consumes those publishes rather than building
  # its own, so a dispatch costs two AOT publishes rather than four.
  #
  # The package is UNSIGNED on purpose. The Store re-signs after certification, which is the whole
  # reason this format was chosen: no certificate to buy, rotate, or leak, and no SmartScreen
  # prompt. The consequence is that this artifact cannot be installed by double-clicking it; see
  # packaging/windows/msix/README.md for how to test one locally.
  msix:
    timeout-minutes: 20
    needs: [build, publish-apps]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false   # only packaging/windows/msix is needed
        lfs: false
        # History and tags, for the one line in the baked submission record that states the span
        # since the previous Store package. Nothing else in this job needs it, and the bake writes
        # "an unrecorded number of commits" rather than failing if it is ever taken away again.
        fetch-depth: 0
    # Both Windows publishes, each landing in publish/<artifact-name>/. The viewer bundles its own
    # font and the AI weights, so nothing here needs an LFS object of its own.
    - name: Download the Windows publishes
      uses: actions/download-artifact@v8
      with:
        pattern: tianwen-fits-win-*
        path: publish
    - name: Resolve the package version
      shell: bash
      run: |
        # MSIX is Major.Minor.Build.Revision and the Store RESERVES the revision, so it has to be
        # 0 or the upload is rejected. VERSION_PREFIX is already Major.Minor.<run_number>, so the
        # fourth part is appended rather than reusing VERSION_REV (run_attempt), which would put a
        # non-zero revision on the package on any re-run.
        echo "MSIX_VERSION=${VERSION_PREFIX}.0" >> "$GITHUB_ENV"
        echo "Package version: ${VERSION_PREFIX}.0"
    - name: Pack each architecture
      shell: pwsh
      run: |
        foreach ($arch in 'x64', 'arm64') {
          ./packaging/windows/msix/build-msix.ps1 `
            -PublishDir "publish/tianwen-fits-win-$arch" `
            -Arch $arch -Version $env:MSIX_VERSION `
            -OutFile "artifacts/AstroPhotoViewer-$arch.msix"
        }
    # One bundle carrying both architectures, which is what Partner Center takes for a multi-arch
    # submission. makeappx is resolved by the same script, so its pinned version cannot drift
    # between the pack and the bundle.
    - name: Bundle both architectures
      shell: pwsh
      run: |
        ./packaging/windows/msix/build-msix.ps1 `
          -BundleDir artifacts -BundleVersion $env:MSIX_VERSION `
          -BundleOut bundle/AstroPhotoViewer.msixbundle
    - name: Say what to do with it
      shell: bash
      run: |
        echo "### Store package: AstroPhotoViewer.msixbundle (${MSIX_VERSION})" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Unsigned by design; the Store signs it after certification. Upload it to the draft" >> "$GITHUB_STEP_SUMMARY"
        echo "submission for Store ID 9PMDZP16TGBG. It cannot be installed by double-clicking." >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Its What's New copy rides along as **msix-release-notes**, baked for this run." >> "$GITHUB_STEP_SUMMARY"
    # The package is uploaded BEFORE the record is baked, deliberately. The bake is allowed to fail
    # the job (an over-cap What's New cannot be pasted, and the field does not say what it did with
    # one), and a red packaging lane must not also cost the package that was built fine.
    - uses: actions/upload-artifact@v7
      with:
        name: msix-store-package
        path: bundle/*.msixbundle
        # Longer than the 5 days the build artifacts get: this one is uploaded to Partner Center by
        # hand, which may not happen the same day the run is dispatched.
        retention-days: 30
    # The record's version ends in the run number, so it cannot be written before the run exists and
    # writing it afterwards means writing it from memory. The draft lives at release-notes/NEXT.txt
    # and this fills the number in, measures the Partner Center block and refuses a placeholder that
    # survived. Rationale and both failure modes: the script's own header.
    - name: Bake the submission record
      shell: pwsh
      run: |
        ./packaging/windows/msix/bake-release-notes.ps1 `
          -Version $env:VERSION_PREFIX -RunId $env:GITHUB_RUN_ID `
          -OutFile "notes/$($env:VERSION_PREFIX).txt" `
          -PasteFile "notes/whats-new-$($env:VERSION_PREFIX).txt"
    - uses: actions/upload-artifact@v7
      with:
        name: msix-release-notes
        path: notes/*.txt
        # Same 30 days as the package it describes: the two are submitted together and are only
        # true of each other within one run.
        retention-days: 30

  # The macOS disk images for the FITS viewer (as Astro Photo Viewer) and the GUI, one per
  # architecture, from the two osx publishes above. There is no Mac in the loop: this runner is it.
  #
  # Unlike the Store lanes there is nobody to re-sign after us, so this job signs and notarizes
  # itself when the Developer ID secrets are present, and signs AD-HOC when they are not -- the
  # lane stays green on a fork or before the Apple Developer Program exists, and the result still
  # runs (via System Settings > Privacy & Security > Open Anyway, since Gatekeeper cannot verify
  # the developer). The five secrets and how to mint them: packaging/macos/README.md.
  #
  # Gated on publish-apps because it consumes those publishes rather than building its own. The
  # release job waits for it, so a release always carries its Mac installers; a notary-service
  # outage therefore blocks a release rather than shipping one without them, which is the right
  # way round -- re-dispatch.
  dmg:
    timeout-minutes: 30   # notarization waits on Apple: usually minutes, occasionally longer
    needs: [build, publish-apps]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # A step's `if` cannot read the secrets context (the workflow fails to PARSE, with no jobs at
      # all, which is how this lane shipped red twice); a job's `env` can, so the presence tests are
      # evaluated here and the steps below read the answers.
      HAVE_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false   # only packaging/macos and the two .ico files are needed
        lfs: false
    - name: Download the viewer's macOS publishes
      uses: actions/download-artifact@v8
      with:
        pattern: tianwen-fits-osx-*
        path: publish
    - name: Download the GUI's macOS publishes
      uses: actions/download-artifact@v8
      with:
        pattern: tianwen-gui-osx-*
        path: publish
    # A throwaway keychain that nothing outlives, unlocked and put first in the search list so a
    # non-interactive codesign finds the identity; the partition list is what lets it use the
    # private key without a prompt. The identities it lists at the end are the first thing to read
    # when a signature fails.
    - name: Import the Developer ID certificate
      if: env.HAVE_SIGNING_CERTIFICATE == 'true'
      env:
        P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      shell: bash
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(uuidgen)"
        echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
        security list-keychains -d user -s "$keychain"
        rm "$RUNNER_TEMP/certificate.p12"
        security find-identity -v -p codesigning "$keychain"
    - name: Materialise the notary key
      if: env.HAVE_NOTARY_KEY == 'true'
      env:
        KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      shell: bash
      run: |
        echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
    - name: Build, sign and notarize the disk images
      shell: bash
      run: |
        for app in fits gui; do
          for arch in arm64 x64; do
            bash packaging/macos/build-dmg.sh --app "$app" \
              --publish-dir "publish/tianwen-$app-osx-$arch" \
              --version "$VERSION_PREFIX" \
              --out "dmg/tianwen-$app-osx-$arch.dmg"
          done
        done
    - name: Say what came out
      shell: bash
      run: |
        if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
          echo "### macOS images: Developer ID signed (${MACOS_SIGN_IDENTITY}), ${VERSION_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### macOS images: AD-HOC signed, ${VERSION_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No MACOS_SIGN_IDENTITY secret, so a downloaded copy needs Privacy & Security > Open Anyway." >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"
        ls -la dmg/*.dmg >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: macos-dmg
        path: dmg/*.dmg

  # Gating: only ship binaries to a GitHub Release when tests pass AND all
  # target-platform publishes succeeded. Workflow_dispatch only -- piggybacks
  # off publish-apps, which is also dispatch-gated.
  release:
    timeout-minutes: 15   # uploads only
    needs: [build, test-unit, test-unit-debug, test-functional, publish-apps, dmg]
    # Dispatch AND main, because the tag below is derived from the version rather than from the
    # ref: a dispatch on a feature branch would publish v<major>.<minor>.<run> pointing at a commit
    # that is not on main, and there is nothing in the name to say so. The dispatch-only gate reads
    # like it covers this and does not -- workflow_dispatch takes a ref. publish-apps and msix stay
    # branch-agnostic on purpose: their output is an artifact a human collects, so running them off
    # a branch is exactly how a packaging lane gets tested before it is merged.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    steps:
    # Only what the release ships: the four apps' publishes and the macOS images. An unfiltered download also takes
    # the run's test output, LFS payload, catalogs and packages (openphd2-multiscope's release failed on a log this way).
    - uses: actions/download-artifact@v8
      with:
        pattern: tianwen-*
        path: artifacts
    - uses: actions/download-artifact@v8
      with:
        name: macos-dmg
        path: artifacts/macos-dmg
    - name: Create release archives
      run: |
        cd artifacts
        for dir in tianwen-cli-*/ tianwen-fits-*/ tianwen-gui-*/ tianwen-server-*/; do
          name="${dir%/}"
          tar -czf "../${name}.tar.gz" -C "$dir" .
        done
        # The macOS images ship as they are: a .dmg is already the archive. The artifact is named
        # so the tarball glob above cannot pick it up.
        cp macos-dmg/*.dmg ..
    - name: Create GitHub Release
      uses: SharpAstro/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION_PREFIX }}
        name: v${{ env.VERSION_PREFIX }}
        generate_release_notes: true
        files: |
          tianwen-cli-*.tar.gz
          tianwen-fits-*.tar.gz
          tianwen-gui-*.tar.gz
          tianwen-server-*.tar.gz
          tianwen-fits-osx-*.dmg
          tianwen-gui-osx-*.dmg

  # NuGet push still gates on tests -- once a version is pushed to nuget.org
  # we can't take it back, so being on the safer side is worth the serial wait.
  # A test job skipped because its tree was already tested on its PR (build's tested-on-pr) counts as
  # passed, and only then: a skip would otherwise skip this job too, and a failed or cancelled test job
  # still stops the push. `!cancelled()` is what makes the condition evaluated at all once a need was
  # skipped.
  # The one check main's ruleset requires, for a PR and for the merge queue: build passed, and each test job passed
  # or was skipped as it should be (the merge queue, or a push of a tree its PR tested).
  gate:
    timeout-minutes: 5
    needs: [build, build-linux, test-unit, test-unit-debug, test-functional, build-windows, test-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Build and tests passed
      run: |
        echo "build: ${{ needs.build.result }}, build-linux: ${{ needs.build-linux.result }}, test-unit: ${{ needs.test-unit.result }}, test-unit-debug: ${{ needs.test-unit-debug.result }}, test-functional: ${{ needs.test-functional.result }}, build-windows: ${{ needs.build-windows.result }}, test-windows: ${{ needs.test-windows.result }}, event: ${{ github.event_name }}, tested-on-pr: ${{ needs.build.outputs.tested-on-pr }}"
        ok() { [ "$1" = success ] || { [ "$1" = skipped ] && { [ "${{ github.event_name }}" = merge_group ] || [ "${{ needs.build.outputs.tested-on-pr }}" = true ]; }; }; }
        # The test builds are checked too, though a failed one already skips its tests (which ok refuses on a PR): so
        # the check reads as what it means.
        [ "${{ needs.build.result }}" = success ] && ok "${{ needs.build-linux.result }}" && ok "${{ needs.build-windows.result }}" \
          && ok "${{ needs.test-unit.result }}" && ok "${{ needs.test-unit-debug.result }}" && ok "${{ needs.test-functional.result }}" && ok "${{ needs.test-windows.result }}"

  publish-nuget:
    timeout-minutes: 15   # one push
    needs: [build, test-unit, test-unit-debug, test-functional]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && (needs.test-unit.result == 'success' || (needs.test-unit.result == 'skipped' && needs.build.outputs.tested-on-pr == 'true'))
      && (needs.test-unit-debug.result == 'success' || (needs.test-unit-debug.result == 'skipped' && needs.build.outputs.tested-on-pr == 'true'))
      && (needs.test-functional.result == 'success' || (needs.test-functional.result == 'skipped' && needs.build.outputs.tested-on-pr == 'true'))
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
