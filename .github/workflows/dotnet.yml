name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # publish-apps + release are gated on workflow_dispatch only -- LFS bandwidth
  # makes it too expensive to publish all six AOT RIDs on every push to main.
  # Trigger via the /release-tianwen skill (gh workflow run dotnet.yml).
  workflow_dispatch:

env:
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The version is CAPTURED from `dotnet msbuild -getProperty` stdout in build's "Resolve version
  # prefix" step, so the SDK's first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    # Every job in this repo is bounded. GitHub's default is SIX HOURS, and that is not a
    # theoretical ceiling: an unreachable apt archive parked a sibling repo's job on it for a whole
    # morning on 2026-08-19, and a hung step gates everything downstream of it while burning runner
    # minutes. Healthy durations are noted per job; the limits are generous multiples of them, so a
    # job over its limit is stuck rather than slow. publish-apps has no measured figure (it only
    # runs on workflow_dispatch and none is recent), so its bound is a guess sized to catch a hang
    # rather than to be tight.
    timeout-minutes: 20   # healthy 3m18s
    runs-on: ubuntu-latest
    # Published for the downstream jobs. $GITHUB_ENV is PER-JOB, so the `echo >> $GITHUB_ENV` step
    # that single-job repos use (Lzip.Lib, the reference implementation) would set VERSION_PREFIX
    # for this job only and leave test-unit / test-functional / publish-apps / release with an empty
    # value -- silently malforming `-p:Version=` and tagging a release `v.`. A job output crosses
    # the boundary; each consumer maps it back to the same env name, so no `run:` line changes.
    # Resolved here rather than in a dedicated `version` job so it costs no extra runner: this job
    # already checks out and sets up the SDK, and a separate job would serialise its own startup
    # onto every push and PR.
    outputs:
      version-prefix: ${{ steps.resolve-version.outputs.prefix }}
    steps:
    # The PreprocessCatalogs MSBuild target produces the *.gs.gz embedded
    # resources from *.json.lz / *.csv.lz sources, decoding the .lz inputs with
    # the managed lzip decoder (Lzip.Lib) and writing the .gs.gz output via .NET
    # GZipStream -- no external `lzip` binary is needed. *.gs.gz is gitignored,
    # so a fresh checkout regenerates it during build.
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Narrow LFS pull: build needs catalog .lz (TianWen.Lib EmbeddedResource),
    # milkyway .lz (Gui Content), fonts .ttf (Gui Content), the prebaked
    # snapshot .bin.gz files (TianWen.Lib EmbeddedResource - if missing, the
    # LFS pointer text gets embedded and runtime gzip read fails), and the
    # in-repo AI model weights .onnx (TianWen.AI.Imaging Content, copied to
    # every consuming app's output + publish dir). Skipping test fixtures
    # (*.fits.gz) saves ~120 MB per pull -- they're only needed by the test
    # jobs, not for compilation or the .nupkg artifact.
    #
    # The .onnx in this glob is a leftover and a no-op: the weights are a plain git
    # blob now, so checkout already carries them and `git lfs pull` has nothing to do
    # for them. It is kept only so the glob still matches the cache key computed above.
    # (It used to be here to keep this glob identical to publish-apps', which shared the
    # lfs-build- cache; that job takes the lfs-payload artifact instead now.)
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        # Pointer file content (OID + size) changes only when the underlying
        # LFS object changes, so a pointer-hash key reliably identifies which
        # set of LFS objects we'd be pulling. Cache hit -> no LFS bandwidth.
        HASH=$(git ls-files '*.lz' '*.ttf' '*.bin.gz' '*.onnx' | xargs cat | sha256sum | cut -c1-16)
        echo "key=lfs-build-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
        # A changed key (any LFS pointer added or updated) restores the newest previous
        # object set so `git lfs pull` fetches only the delta. Without this, adding one
        # 3 MB file meant a full cold re-pull of every object in the glob per leg --
        # which is what turned the 2026-08-17 LFS-budget refusal into a hard CI failure.
        # (The budget itself was spent by non-CI pulls; every sampled run that month rode
        # a cache hit and transferred nothing.)
        restore-keys: |
          lfs-build-
    - name: Fetch required LFS objects
      run: git lfs pull --include="*.lz,*.ttf,*.bin.gz,*.onnx"
    # Hand the materialised files to the publish matrix as an artifact so those legs never
    # touch LFS at all. They used to restore the lfs-build- cache this job saves, which a
    # Windows runner cannot read (actions/cache segregates Windows from POSIX entries unless
    # enableCrossOsArchive is set), so both Windows legs always fell through to a live
    # `git lfs pull` -- merely costly while the LFS budget held, fatal once it ran dry.
    # Artifacts cross OSes freely, so the publish legs stop depending on the budget at all.
    #
    # Tar rather than handing upload-artifact a path list: it roots paths at their least
    # common ancestor, which would flatten src/TianWen.Lib/... and src/TianWen.UI.Gui/...
    # into one tree. The tar keeps repo-relative paths, so a leg unpacks it over its own
    # checkout and every file lands where the csproj expects it.
    #
    # *.onnx is absent on purpose: it is a plain git blob now, so checkout carries it.
    - name: Package LFS payload for the publish matrix
      run: |
        git ls-files '*.lz' '*.ttf' '*.bin.gz' > lfs-payload.list
        tar -czf lfs-payload.tar.gz -T lfs-payload.list
        echo "packaged $(wc -l < lfs-payload.list) files, $(du -h lfs-payload.tar.gz | cut -f1)"
    - uses: actions/upload-artifact@v7
      with:
        name: lfs-payload
        path: lfs-payload.tar.gz
        if-no-files-found: error
        retention-days: 1
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: src/Directory.Packages.props
    # Read the major.minor back from the ONE place it is written (src/Directory.Build.props ->
    # VersionMajorMinor) instead of restating it in this file. It used to be a literal in the
    # workflow `env:`, so the number lived in two places and nothing compared them.
    #
    # -getProperty only EVALUATES the file: nothing is built and no restore is needed, so this runs
    # before restore. The value is CAPTURED from stdout, so nothing else may print to it:
    # DOTNET_NOLOGO (workflow env) keeps the SDK first-run banner out, and the shape check makes
    # anything unexpected, or a renamed property, FAIL the run rather than quietly stamping every
    # package and the release tag as ".<run>". Written to BOTH $GITHUB_ENV (for this job's own steps)
    # and $GITHUB_OUTPUT (for the downstream jobs, since $GITHUB_ENV does not cross a job boundary).
    - name: Resolve version prefix
      id: resolve-version
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo | tr -d '[:space:]')"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "Resolved VERSION_PREFIX=${MM}.${{ github.run_number }}"
    # The baked icon table is generated from src/TianWen.UI.Abstractions/icons.recipe and committed. The
    # build already warns (TWIC0001) when the recipe is NEWER than the table, but a timestamp only ever
    # catches a forgotten re-bake -- it cannot see a table that was hand-edited, or one committed from a
    # different font. Re-baking and comparing can, because the bake is byte-reproducible:
    # ManagedFontRasterizer is pure managed, so the same recipe and font give identical output on any
    # host. Runs before restore because it needs neither the solution nor its packages, only `dnx`.
    #
    # Fails the run rather than warning: unlike a stale-timestamp warning this cannot fire spuriously --
    # a mismatch means the committed table does not correspond to the recipe beside it, and the marks
    # that ship would not be the ones the recipe describes.
    - name: Verify the baked icon table matches its recipe
      run: pwsh tools/bake-icons.ps1 -Verify
    # The cheap half of the MSIX lane, deliberately here rather than only in the msix job: that
    # job is dispatch-only, and a packaging lane first exercised while cutting a release is one
    # discovered to be broken at the worst moment. This validates the manifest is well-formed XML,
    # that every logo it names exists at the size its name claims, and that the version rules hold
    # (four parts, none over 65535, revision 0). No publish, no packing, about a second.
    - name: Validate the MSIX manifest and assets
      run: pwsh packaging/windows/msix/build-msix.ps1 -ValidateOnly
    - name: Restore dependencies
      run: dotnet restore
      working-directory: src
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src
    # Share the preprocessed catalog .gs.gz files with the test + publish jobs so
    # they skip re-running PreprocessCatalogs (and the catalog LFS pull), esp.
    # publish-apps on its cross-platform matrix. Downstream jobs download into the
    # same path and rely on file mtime > *.json.lz mtime to skip the target.
    - name: Upload preprocessed catalogs
      uses: actions/upload-artifact@v7
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/*.gs.gz
        retention-days: 1
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5
    # TianWen.UI.Web is IN TianWen.slnx, so the Build step above already compiled it; only the E2E
    # harness lives outside (IsTestProject + Playwright, so a solution-wide dotnet test would sweep a
    # suite needing a browser and a served app). An API change in TianWen.UI.Abstractions, or a sibling
    # pin bump that moves WebGl.Renderer, used to reach pages.yml AFTER merge as a broken deploy.
    # This is the QUICK build: interpreted, no AOT and no native relink, so it needs no wasm-tools
    # workload, and it compiles against the libraries this job has already built. That is what makes
    # it affordable on every push and PR (~1 min) rather than the deploy's full AOT publish.
    #
    # Placed after the uploads so a web-only break still leaves the catalog + package artifacts
    # behind, and three details are deliberate, each because the alternative costs a FULL rebuild of
    # TianWen.Lib (catalog resources and all) instead of reusing the Build step above:
    #  - The version properties are repeated verbatim from Build. A different -p:Version regenerates
    #    AssemblyInfo for every project in the graph -- and TianWen.Lib sets GeneratePackageOnBuild,
    #    so a rebuild here at a DIFFERENT version would also drop a second, stray .nupkg beside the
    #    real one (the org-wide trap in ../.github/CLAUDE.md, which --skip-duplicate then hides).
    #  - No -p:Lightweight=true, even though the deploy passes it. It only REMOVES an EmbeddedResource
    #    from TianWen.Lib, so it changes no C# and no razor -- there is nothing extra to cover -- but
    #    it does change Lib's inputs.
    #  - No --no-restore: the solution restore never saw this project, so it restores here.
    #
    # What this CANNOT catch, and pages.yml still owns: the AOT leg (the mono cross-compiler
    # fail-fasts on the vendor SDK assemblies TianWen.UI.Web works around), trimming, and anything at
    # runtime. The E2E suite is COMPILED here but not RUN -- it needs a browser and a served app.
    - name: Build TianWen.UI.Web.E2E (compiled, not run)
      run: |
        dotnet build TianWen.UI.Web.E2E/TianWen.UI.Web.E2E.csproj -c $BUILD_CONF -p:UseLocalSiblings=false -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src

  test-unit:
    timeout-minutes: 25   # healthy ~6m
    needs: build
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    # Matrix on x86_64 + ARM64 so we cover both architectures, plus a third leg for the
    # DEBUG-gated suites. `fail-fast: false` so a regression on one leg doesn't cancel the others.
    #
    # The DEBUG leg is a MATRIX LEG rather than a job of its own, and that is the whole point of
    # the shape. It used to run inside the Release legs, after their tests, so its Debug compile
    # plus test run was pure serial tail on the critical path of BOTH architectures. It cannot be
    # merged into them either, because it needs a different CONFIGURATION of the same sources. A
    # separate job would have to repeat this job's ~85-line preamble (apt + Vulkan, the narrow LFS
    # cache and pull, the catalog artifact, restore) -- three copies of a setup that is already the
    # subtlest part of this file. As a leg it inherits all of that unchanged and simply runs
    # somewhere else, in parallel, so the wall clock is now max(Release, Debug) instead of the sum.
    #
    # One architecture for it, deliberately: the DebugOnly tests are arch-independent and the only
    # thing the second arch bought was a second Debug COMPILE. That is a thin cover to pay a whole
    # runner for, and the Release legs still compile on both.
    #
    # `name:` is set explicitly, and that is a compatibility requirement rather than cosmetics. A
    # matrix job's check name is generated from its matrix values, so adding a `config` dimension
    # would have renamed the two existing checks to "test-unit (ubuntu-latest, Release)" and
    # "test-unit (ubuntu-24.04-arm, Release)". main is protected by an org-level ruleset, and a
    # required status check is matched BY NAME: renaming one does not relax the rule, it leaves the
    # rule waiting forever on a check that no longer reports. Naming the legs from `leg` keeps the
    # two existing names byte-identical and makes this change purely additive -- the new
    # "test-unit (debug)" simply is not required until somebody adds it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            config: Release
            leg: ubuntu-latest
          - runner: ubuntu-24.04-arm
            config: Release
            leg: ubuntu-24.04-arm
          - runner: ubuntu-latest
            config: Debug
            leg: debug
    name: test-unit (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    steps:
    # cache-apt-pkgs-action installs the listed packages (apt-get install behind
    # the scenes) but caches /var/cache/apt by `version` key. First run pays
    # the full ~80 MB; subsequent runs restore in ~2s. fc-cache still runs to
    # rebuild the local fontconfig index.
    #
    # mesa-vulkan-drivers + libvulkan1 + vulkan-tools provide a software Vulkan
    # stack (Mesa lavapipe) so the GPU comp tests can run end-to-end against the
    # offscreen renderer instead of skipping. The GitHub-hosted ubuntu runner has
    # no GPU, so the Vulkan loader auto-picks the lavapipe ICD. Bump `version`
    # whenever this package list changes -- it controls the apt cache key.
    - uses: SharpAstro/cache-apt-pkgs-action@v1
      with:
        # lldb: on a native testhost crash, symbolicate the runtime minidump on THIS runner (where
        # the crashed process's .so files still exist) so the "Symbolicate crash dump" step below
        # resolves module names -- the offline analyze-crash-dump workflow can't (a fresh runner
        # lacks those .so, hence lldb's "no associated executable images").
        packages: ghostscript fonts-urw-base35 fontconfig mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers lldb
        version: 1.4
    - name: Rebuild fontconfig cache
      run: fc-cache -f
    # Sanity-check that the Vulkan loader can enumerate at least one ICD before
    # the unit-test step. If this fails or lists 0 ICDs, the GPU comp tests
    # will skip rather than fail -- but the diagnostic in the build log saves
    # a round trip when debugging.
    - name: Vulkan ICD summary
      run: vulkaninfo --summary || true
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Narrow LFS pull: tests need catalogs (.lz), fonts (.ttf), FITS test
    # fixtures (.fits.gz) embedded in TianWen.Lib.Tests.dll, and the in-repo AI
    # model weights (.onnx) so N2nDenoiserTests' cross-language parity test runs
    # here instead of skipping.
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        HASH=$(git ls-files '*.lz' '*.ttf' '*.bin.gz' '*.fits.gz' '*.CR2' '*.CR3' '*.cr2' '*.cr3' '*.onnx' | xargs cat | sha256sum | cut -c1-16)
        echo "key=lfs-tests-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
        # A changed key (any LFS pointer added or updated) restores the newest previous
        # object set so `git lfs pull` fetches only the delta. Without this, adding one
        # 3 MB file meant a full ~205 MB cold re-pull per leg -- which is what turned the
        # 2026-08-17 LFS-budget refusal into a hard CI failure. (The budget itself was
        # spent by non-CI pulls; every sampled run that month rode a cache hit.) The
        # prefix is shared with the other test job on purpose: their globs overlap almost
        # entirely, so either job's saved set is a near-complete starting point for the
        # other.
        restore-keys: |
          lfs-tests-
    - name: Fetch required LFS objects
      # `*.CR2`/`*.cr2` cover Cr2ImportTests (Data/CR2/*, ~19 MB). `*.CR3`/`*.cr3`
      # cover Cr3ImportTests (Data/CR3/*, ~7 MB). Both case variants are tracked
      # in .gitattributes; we only ship uppercase today but the include set is
      # exhaustive so a future lowercase-named fixture from a Canon body that
      # emits one doesn't silently skip in CI.
      run: git lfs pull --include="*.lz,*.ttf,*.bin.gz,*.fits.gz,*.CR2,*.CR3,*.cr2,*.cr3,*.onnx"
    # Pull in the .gs.gz preprocessed catalogs from the build job so the
    # preprocess-catalog.ps1 script doesn't have to re-run here. Touch them to
    # be newer than .json.lz so MSBuild's Inputs/Outputs check skips the
    # PreprocessCatalogs target.
    - name: Download preprocessed catalogs
      uses: actions/download-artifact@v8
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/
    - name: Refresh preprocessed catalog mtimes
      run: touch src/TianWen.Lib/Astrometry/Catalogs/*.gs.gz
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: src/Directory.Packages.props
    - name: Restore dependencies
      run: dotnet restore
      working-directory: src
    - name: Build
      # Release legs only. The DEBUG leg builds its own, narrower target below -- it must NOT build
      # the solution in Debug, because CI resolves siblings as PACKAGES and a published package is
      # built Release, so the #if DEBUG types the debug-inspector layer consumes are absent from it
      # (CS0234 on DIR.Lib.Diagnostics and its counterparts). TianWen.Lib.Tests alone does not reach
      # those projects, which is why the Debug build below is scoped to it.
      if: matrix.config == 'Release'
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src
    - name: Unit Tests
      if: matrix.config == 'Release'
      # verbosity=detailed surfaces ITestOutputHelper messages for Skip+Pass tests too,
      # not just Fail, which is useful for the GPU comp tests' diagnostic dumps.
      #
      # --blame-crash + --blame-hang capture a Sequence_*.xml (last test before
      # the testhost died) and a *.dmp (testhost crash dump) under test-results/.
      # The hang timeout fires when a single test stalls > 5 min, which catches
      # the "tests finished but testhost lingered then crashed" pattern we saw
      # on the ubuntu-24.04-arm runner in run 26022912901 (70 s of silence after
      # the last test before SIGSEGV).
      #
      # DOTNET_DbgEnableMiniDump is belt-and-suspenders: the runtime writes its
      # own minidump on any unhandled .NET exception or fatal-runtime event,
      # not just on the testhost-process crash xUnit detects. Type=2 = "Heap"
      # (managed heap + all threads, no full process memory). Path templated
      # so multiple dumps don't overwrite each other.
      env:
        DOTNET_DbgEnableMiniDump: "1"
        DOTNET_DbgMiniDumpType: "2"
        DOTNET_DbgMiniDumpName: /tmp/coredump-%e-%p-%t.dmp
      run: dotnet test TianWen.Lib.Tests -c $BUILD_CONF --no-build --logger "console;verbosity=detailed" --blame-crash --blame-hang --blame-hang-timeout 5min --results-directory test-results/
      working-directory: src
    # ---------------------------------------------------------------------------------------
    # DEBUG leg. Some instrumentation is compiled out of Release, so the Release run above
    # SKIPS the tests that cover it and is no cover at all. ChannelBufferLeakTracker (P2 of
    # docs/plans/frame-lifecycle.md) is the first of these: its tests open with
    # Assert.SkipUnless(ChannelBufferLeakTracker.IsActive), which is the honest report for a
    # Release run but would otherwise leave the feature verified nowhere.
    #
    # Selected by TRAIT, never by a list of class names, so a future DEBUG-gated suite is
    # picked up by adding [Trait("Category", "DebugOnly")] and nothing here has to be
    # remembered. It is its own matrix leg (see the strategy block), so it no longer runs as
    # a serial tail on the Release legs' critical path.
    - name: Build (Debug, for the DEBUG-gated suites)
      if: matrix.config == 'Debug'
      # Same version properties as the Release build above, and GeneratePackageOnBuild off:
      # TianWen.Lib packs on build, and a Debug pack would drop a second .nupkg beside the
      # Release one. Harmless in this job (publish runs elsewhere and globs its own runner)
      # but it costs time and it is the exact shape that has bitten sibling repos.
      run: dotnet build TianWen.Lib.Tests -c Debug --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false
      working-directory: src
    - name: Unit Tests (DEBUG-gated instrumentation)
      if: matrix.config == 'Debug'
      # The guard is not optional. `dotnet test` with a filter that matches NOTHING prints
      # "No test matches the given testcase filter" and exits 0, so a renamed or mistyped
      # trait would turn this whole leg into a green no-op -- the same vacuous pass the
      # SkipUnless above exists to prevent, one level up. Read the count back from the TRX
      # and fail when it is zero.
      run: |
        dotnet test TianWen.Lib.Tests -c Debug --no-build --filter "Category=DebugOnly" \
          --logger "console;verbosity=detailed" --logger "trx;LogFileName=debug-only.trx" \
          --results-directory test-results-debug/
        RAN=$(sed -n 's/.*<Counters total="\([0-9]*\)".*/\1/p' test-results-debug/debug-only.trx)
        echo "DEBUG-gated tests executed: ${RAN:-0}"
        if [ "${RAN:-0}" -lt 1 ]; then
          echo "::error::The DEBUG leg ran no tests. Category=DebugOnly matched nothing, so the instrumentation it covers is unverified."
          exit 1
        fi
      working-directory: src
    # On a native testhost crash (SIGSEGV -> exit 139), symbolicate the runtime minidump HERE, on
    # the same runner, while the crashed process's shared libraries are still on disk -- lldb reads
    # the minidump's module list and loads those .so from their recorded paths, so the backtrace
    # names the culprit (e.g. the lavapipe software-Vulkan .so) directly in this run's log. The
    # offline analyze-crash-dump workflow only gets bare addresses (its runner lacks the .so).
    # Best-effort + capped: never let analysis failure mask the real test failure.
    - name: Symbolicate crash dump (native stacks)
      if: failure()
      run: |
        set +e
        shopt -s nullglob
        dumps=(/tmp/coredump-*.dmp)
        if [ ${#dumps[@]} -eq 0 ]; then
          echo "no runtime minidump (/tmp/coredump-*.dmp) -- the failure was not a native crash"
          exit 0
        fi
        for d in "${dumps[@]}"; do
          echo "==== lldb backtrace ($d, $(du -h "$d" | cut -f1)) ===="
          lldb --batch -c "$d" \
            -o "thread backtrace all" \
            -o "image list" \
            -o "quit" 2>&1 | head -c 500000
          echo "(lldb exit $?)"
        done
    # Upload test temp output (cpu.tiff / gpu.tiff / diff.tiff and other test
    # fixtures) when tests fail, so CPU/GPU divergences in GpuStretchPipelineTests
    # can be diagnosed without re-running CI to add diagnostics.
    - name: Upload GPU stretch test output on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: gpu-stretch-test-output-${{ matrix.leg }}
        # Narrow to just the GpuStretchPipelineTests subdir -- /tmp/TianWen.Lib.Tests/
        # aggregates outputs from every test in the suite (>2 GB on a full failure run);
        # this slice is ~15 MB (cpu.tiff + gpu.tiff + diff.tiff per case).
        path: /tmp/TianWen.Lib.Tests/*/GpuStretchPipelineTests/
        if-no-files-found: ignore
        retention-days: 7
    # Upload --blame-crash / --blame-hang artifacts + runtime minidumps so
    # a SIGSEGV / hang in the testhost can be diagnosed without re-running.
    # The Sequence_*.xml inside test-results/ names the last test executed
    # before the crash; the *.dmp files (testhost + runtime) are loadable
    # in `dotnet-dump analyze` or lldb.
    - name: Upload test-blame + crash dumps on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-blame-${{ matrix.leg }}
        path: |
          src/test-results/
          src/test-results-debug/
          /tmp/coredump-*.dmp
        if-no-files-found: ignore
        retention-days: 14

  test-functional:
    timeout-minutes: 20   # healthy 4m24s
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    steps:
    # astrometry-data-2mass-08-19 alone is ~1 GB. Caching saves ~30-60s and a
    # fair chunk of network on every run.
    - uses: SharpAstro/cache-apt-pkgs-action@v1
      with:
        packages: astrometry.net astrometry-data-2mass-08-19
        version: 1.0
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # Narrow LFS pull: same as test-unit -- catalogs, fonts, FITS fixtures.
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        HASH=$(git ls-files '*.lz' '*.ttf' '*.bin.gz' '*.fits.gz' | xargs cat | sha256sum | cut -c1-16)
        echo "key=lfs-tests-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
        # A changed key (any LFS pointer added or updated) restores the newest previous
        # object set so `git lfs pull` fetches only the delta. Without this, adding one
        # 3 MB file meant a full ~205 MB cold re-pull per leg -- which is what turned the
        # 2026-08-17 LFS-budget refusal into a hard CI failure. (The budget itself was
        # spent by non-CI pulls; every sampled run that month rode a cache hit.) The
        # prefix is shared with the other test job on purpose: their globs overlap almost
        # entirely, so either job's saved set is a near-complete starting point for the
        # other.
        restore-keys: |
          lfs-tests-
    - name: Fetch required LFS objects
      run: git lfs pull --include="*.lz,*.ttf,*.bin.gz,*.fits.gz"
    - name: Download preprocessed catalogs
      uses: actions/download-artifact@v8
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/
    - name: Refresh preprocessed catalog mtimes
      run: touch src/TianWen.Lib/Astrometry/Catalogs/*.gs.gz
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: src/Directory.Packages.props
    - name: Restore dependencies
      run: dotnet restore
      working-directory: src
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
      working-directory: src
    - name: Functional Tests
      run: dotnet test TianWen.Lib.Tests.Functional -c $BUILD_CONF --no-build
      working-directory: src

  # publish-apps runs in parallel with the test jobs -- dotnet publish is long
  # on AOT targets (multiple minutes per RID), so gating on tests would block
  # the matrix unnecessarily. The `release` job below re-gates: binaries only
  # become a published GitHub Release when both tests AND this matrix succeed.
  #
  # Trigger: workflow_dispatch only (six AOT publishes pull LFS six times,
  # which used to blow through the 1 GB/month free tier on every push to main).
  # Use the /release-tianwen skill to invoke a release.
  publish-apps:
    timeout-minutes: 90   # six AOT RIDs; NOT measured, see the note above
    needs: build
    if: github.event_name == 'workflow_dispatch'
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    # Defender real-time scanning in-lines every file write; on the compile-heavy
    # AOT publish legs (ILC + MSVC link churn thousands of objects) that made the
    # two Windows legs the slowest in the matrix (~6.5-7 min vs ~4-5 min Linux on
    # identical work) -- and the release job gates on the whole matrix, so the
    # Windows legs ARE the release wall time. Excluding the workspace + temp +
    # NuGet cache BEFORE checkout lands any files is the cheap, well-known fix.
    - name: Exclude work dirs from Defender (Windows CI speedup)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:USERPROFILE\.nuget"
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: false
    # These legs do NOT touch LFS. The build job materialises the same set (catalogs .lz for
    # TianWen.Lib EmbeddedResource, fonts + milkyway texture for TianWen.UI.Gui Content) and
    # hands it over as the lfs-payload artifact. No FITS fixtures -- publish never builds the
    # test projects.
    #
    # Why not the lfs-build- cache this used to restore: actions/cache segregates Windows from
    # POSIX entries unless enableCrossOsArchive is set, so the two Windows legs could not read
    # the entry the ubuntu build job saves -- not by key, not by the restore-keys prefix -- and
    # always fell through to a live `git lfs pull`. That merely cost bandwidth while the budget
    # held, then failed outright once it ran dry: release run #1311 computed the SAME key on all
    # six legs, all four POSIX legs hit it, and both Windows legs reported "Cache not found".
    # They could not bootstrap an entry of their own either, since actions/cache saves only when
    # the job succeeds and this one could not get that far.
    #
    # The .onnx is not in the payload because it is a plain git blob now, so the checkout above
    # carries it. It stays in the verify step below, because its absence is SILENT: a ~130-byte
    # pointer is a valid file, Content copies it into the release tarball's models/ dir, and the
    # binary looks complete while ModelResolver refuses the stub -- so `--ai-backend n2n` would
    # go missing from a release with nothing in the build saying so.
    - name: Download LFS payload
      uses: actions/download-artifact@v8
      with:
        name: lfs-payload
    - name: Unpack LFS payload
      shell: bash
      run: |
        tar -xzf lfs-payload.tar.gz
        rm lfs-payload.tar.gz
    # An unmaterialised pointer does not fail anything on its own -- it is a valid ~130-byte
    # text file, so Content copies it into the tarball, EmbeddedResource embeds it, and the
    # release looks complete while the feature it backs is quietly missing. This is the only
    # job whose output ships, so it is the one that must refuse to proceed on a stub. Assert
    # here rather than at the end: the AOT matrix is the expensive part of a release, and
    # there is no reason to spend six legs of it on a build that cannot ship.
    - name: Verify LFS objects materialised
      shell: bash
      run: |
        stubs=0
        for f in $(git ls-files '*.lz' '*.ttf' '*.bin.gz' '*.onnx'); do
          if [ "$(head -c 23 "$f")" = "version https://git-lfs" ]; then
            echo "::error file=$f::still a Git LFS pointer after the pull, so it would ship as a stub"
            stubs=$((stubs + 1))
          fi
        done
        [ "$stubs" -eq 0 ] || exit 1
        echo "all LFS objects materialised"
    # Same artifact pattern as the test jobs -- avoids re-running the
    # preprocess-catalog.ps1 script on the multi-platform publish matrix
    # (Windows / Linux / macOS).
    - name: Download preprocessed catalogs
      uses: actions/download-artifact@v8
      with:
        name: preprocessed-catalogs
        path: src/TianWen.Lib/Astrometry/Catalogs/
    # Touch via PowerShell so the same step works on Windows + Linux + macOS;
    # `touch` (POSIX) is unavailable on the Windows runner.
    - name: Refresh preprocessed catalog mtimes
      shell: pwsh
      run: |
        Get-ChildItem -Path src/TianWen.Lib/Astrometry/Catalogs/ -Filter *.gs.gz |
          ForEach-Object { $_.LastWriteTime = Get-Date }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet caching deliberately OFF here, unlike the push/PR jobs. This job only runs on
        # workflow_dispatch, so the cache it saves is paid for on every pin change and collected
        # almost never -- and setup-dotnet keys per OS, so these legs were the ONLY source of the
        # Windows and macOS entries (1.4 GB per pin bump) while every push/PR job runs on Linux.
        # A miss costs a nuget.org restore, which is free and cannot refuse; the repo cache budget
        # is 10 GB and the lfs-* entries in it are the ones whose miss actually fails a build.
    # The four binaries below are native-AOT, so the entire package graph is statically linked into
    # each executable and those licences have to travel with it. src/Directory.Build.targets attaches
    # LICENSE / LICENSE.EXCEPTION / NOTICE / THIRD-PARTY-NOTICES.txt / astap-readme.txt to the publish
    # output of anything with PublishAot, so the files must be correct BEFORE the publishes run.
    #
    # Regenerated per matrix leg rather than trusting the committed copy, because the graph is
    # platform-sensitive: the ONNX Runtime execution-provider package is chosen by host OS and RID
    # (DirectML on Windows, .Gpu.Linux for linux-x64, the plain CPU package otherwise), so a file
    # generated on one platform names packages another does not link and omits ones it does. Doing it
    # here is what gets each tarball its own accurate notices. The committed copy still matters: it is
    # what a local publish uses, and Content items that point at a missing file fail the publish.
    #
    # The explicit restore is only because the script reads obj/project.assets.json, which restore is
    # what writes; the publishes below would otherwise restore implicitly. It is cache-backed, so the
    # cost is small.
    - name: Restore publishable projects for this RID
      run: |
        for p in TianWen.Cli TianWen.UI.FitsViewer TianWen.UI.Gui TianWen.Server; do
          dotnet restore "src/$p/$p.csproj" -r ${{ matrix.rid }}
        done
      shell: bash
    - name: Generate third-party notices for this platform
      run: ./tools/generate-third-party-notices.ps1
      shell: pwsh
    - name: Publish TianWen.Cli
      run: dotnet publish src/TianWen.Cli/TianWen.Cli.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    - name: Publish TianWen.UI.FitsViewer
      run: dotnet publish src/TianWen.UI.FitsViewer/TianWen.UI.FitsViewer.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    # The Explorer thumbnail provider (a NativeAOT COM DLL, ~3 MB) ships INSIDE the viewer's tree: the
    # MSIX manifest names it by a package-relative path and the tarball's `--register` looks for it
    # beside the exe, so copying it here is what puts it in both the Store package and the release
    # asset with no further step. Windows only, it is a shell extension. Its dependency graph is a
    # subset of the viewer's, so the notices generated above already cover it.
    - name: Publish TianWen.Shell.Thumbnails into the viewer tree
      if: startsWith(matrix.rid, 'win-')
      run: |
        dotnet publish src/TianWen.Shell.Thumbnails/TianWen.Shell.Thumbnails.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
        cp src/TianWen.Shell.Thumbnails/bin/Release/net10.0/${{ matrix.rid }}/publish/tianwen-thumb.dll src/TianWen.UI.FitsViewer/bin/Release/net10.0/${{ matrix.rid }}/publish/
      shell: bash
    - name: Publish TianWen.UI.Gui
      run: dotnet publish src/TianWen.UI.Gui/TianWen.UI.Gui.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    - name: Publish TianWen.Server
      run: dotnet publish src/TianWen.Server/TianWen.Server.csproj -r ${{ matrix.rid }} -c Release -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:GeneratePackageOnBuild=false
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-cli-${{ matrix.rid }}
        path: src/TianWen.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-fits-${{ matrix.rid }}
        path: src/TianWen.UI.FitsViewer/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-gui-${{ matrix.rid }}
        path: src/TianWen.UI.Gui/bin/Release/net10.0/${{ matrix.rid }}/publish/
    - uses: actions/upload-artifact@v7
      with:
        name: tianwen-server-${{ matrix.rid }}
        path: src/TianWen.Server/bin/Release/net10.0/${{ matrix.rid }}/publish/

  # The Microsoft Store package for the FITS viewer, shipped as Astro Photo Viewer.
  #
  # Deliberately NOT gated on the tests, unlike release: this produces an artifact for a human to
  # upload, not something that reaches a user by itself, and the Store runs its own certification
  # on top. It is gated on publish-apps because it consumes those publishes rather than building
  # its own, so a dispatch costs two AOT publishes rather than four.
  #
  # The package is UNSIGNED on purpose. The Store re-signs after certification, which is the whole
  # reason this format was chosen: no certificate to buy, rotate, or leak, and no SmartScreen
  # prompt. The consequence is that this artifact cannot be installed by double-clicking it; see
  # packaging/windows/msix/README.md for how to test one locally.
  msix:
    timeout-minutes: 20
    needs: [build, publish-apps]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false   # only packaging/windows/msix is needed
        lfs: false
    # Both Windows publishes, each landing in publish/<artifact-name>/. The viewer bundles its own
    # font and the AI weights, so nothing here needs an LFS object of its own.
    - name: Download the Windows publishes
      uses: actions/download-artifact@v8
      with:
        pattern: tianwen-fits-win-*
        path: publish
    - name: Resolve the package version
      shell: bash
      run: |
        # MSIX is Major.Minor.Build.Revision and the Store RESERVES the revision, so it has to be
        # 0 or the upload is rejected. VERSION_PREFIX is already Major.Minor.<run_number>, so the
        # fourth part is appended rather than reusing VERSION_REV (run_attempt), which would put a
        # non-zero revision on the package on any re-run.
        echo "MSIX_VERSION=${VERSION_PREFIX}.0" >> "$GITHUB_ENV"
        echo "Package version: ${VERSION_PREFIX}.0"
    - name: Pack each architecture
      shell: pwsh
      run: |
        foreach ($arch in 'x64', 'arm64') {
          ./packaging/windows/msix/build-msix.ps1 `
            -PublishDir "publish/tianwen-fits-win-$arch" `
            -Arch $arch -Version $env:MSIX_VERSION `
            -OutFile "artifacts/AstroPhotoViewer-$arch.msix"
        }
    # One bundle carrying both architectures, which is what Partner Center takes for a multi-arch
    # submission. makeappx is resolved by the same script, so its pinned version cannot drift
    # between the pack and the bundle.
    - name: Bundle both architectures
      shell: pwsh
      run: |
        ./packaging/windows/msix/build-msix.ps1 `
          -BundleDir artifacts -BundleVersion $env:MSIX_VERSION `
          -BundleOut bundle/AstroPhotoViewer.msixbundle
    - name: Say what to do with it
      shell: bash
      run: |
        echo "### Store package: AstroPhotoViewer.msixbundle (${MSIX_VERSION})" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Unsigned by design; the Store signs it after certification. Upload it to the draft" >> "$GITHUB_STEP_SUMMARY"
        echo "submission for Store ID 9PMDZP16TGBG. It cannot be installed by double-clicking." >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: msix-store-package
        path: bundle/*.msixbundle
        # Longer than the 5 days the build artifacts get: this one is uploaded to Partner Center by
        # hand, which may not happen the same day the run is dispatched.
        retention-days: 30

  # Gating: only ship binaries to a GitHub Release when tests pass AND all
  # target-platform publishes succeeded. Workflow_dispatch only -- piggybacks
  # off publish-apps, which is also dispatch-gated.
  release:
    timeout-minutes: 15   # uploads only
    needs: [build, test-unit, test-functional, publish-apps]
    # Dispatch AND main, because the tag below is derived from the version rather than from the
    # ref: a dispatch on a feature branch would publish v<major>.<minor>.<run> pointing at a commit
    # that is not on main, and there is nothing in the name to say so. The dispatch-only gate reads
    # like it covers this and does not -- workflow_dispatch takes a ref. publish-apps and msix stay
    # branch-agnostic on purpose: their output is an artifact a human collects, so running them off
    # a branch is exactly how a packaging lane gets tested before it is merged.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Create release archives
      run: |
        cd artifacts
        for dir in tianwen-cli-*/ tianwen-fits-*/ tianwen-gui-*/ tianwen-server-*/; do
          name="${dir%/}"
          tar -czf "../${name}.tar.gz" -C "$dir" .
        done
    - name: Create GitHub Release
      uses: SharpAstro/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION_PREFIX }}
        name: v${{ env.VERSION_PREFIX }}
        generate_release_notes: true
        files: |
          tianwen-cli-*.tar.gz
          tianwen-fits-*.tar.gz
          tianwen-gui-*.tar.gz
          tianwen-server-*.tar.gz

  # NuGet push still gates on tests -- once a version is pushed to nuget.org
  # we can't take it back, so being on the safer side is worth the serial wait.
  publish-nuget:
    timeout-minutes: 15   # one push
    needs: [test-unit, test-functional]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
