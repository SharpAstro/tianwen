<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Runs</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --dim: #667085; --line: #e3e6eb; --soft: #f0f3f8;
    --ok: #1a7f4b; --warn: #b54708; --bad: #b42318; --idle: #667085; --bar: #3b6fd8; --bar-bg: #e7ecf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --dim: #98a2b3; --line: #2b323d; --soft: #202733;
      --ok: #4ac78a; --warn: #f0a04b; --bad: #f97066; --idle: #98a2b3; --bar: #6b97f0; --bar-bg: #26303f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 19px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 24px 0 8px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .age { color: var(--dim); font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  details > summary { cursor: pointer; font-weight: 600; }
  .programme ul { margin: 8px 0 0; padding-left: 20px; }
  .programme li { margin: 4px 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--dim); font-size: 12px; }
  .tile .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .runs { display: grid; gap: 10px; }
  .run { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .run .title { font-weight: 600; font-size: 15px; }
  .run .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); }
  .kind { color: var(--dim); font-size: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; }
  .state { font-size: 12px; font-weight: 600; border-radius: 10px; padding: 1px 9px; color: #fff; }
  .state.running { background: var(--ok); } .state.done { background: var(--bar); }
  .state.failed, .state.stopped { background: var(--bad); } .state.waiting { background: var(--idle); }
  .what { color: var(--dim); margin: 4px 0 6px; }
  .question { margin: 6px 0; }
  .question b { color: var(--dim); font-weight: 600; }
  .explain { background: var(--soft); border-radius: 6px; padding: 8px 12px; margin: 6px 0 8px; }
  .explain summary { font-size: 13px; color: var(--dim); }
  .explain p { margin: 6px 0; }
  .explain ol { margin: 4px 0; padding-left: 20px; }
  .explain .kill { color: var(--bad); }
  .explain .caveat { color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 18px; font-variant-numeric: tabular-nums; }
  .grid .k { color: var(--dim); }
  .bar { height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--bar); }
  .last { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); white-space: pre-wrap; word-break: break-all; margin-top: 6px; }
  .warn { color: var(--warn); } .bad { color: var(--bad); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 18px; font-size: 13px; }
  .legend b { font-weight: 600; }
  .legend .better { color: var(--dim); font-size: 12px; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); cursor: pointer; }
  td:first-child, th:first-child { text-align: left; }
  td.text, th.text { text-align: left; white-space: normal; min-width: 280px; color: var(--dim); font-size: 12px; }
  td.cmd { text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); white-space: normal; word-break: break-all; }
  tr:last-child td { border-bottom: none; }
  .err { color: var(--bad); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Training runs</h1>
    <span class="age" id="age">loading...</span>
  </header>
  <div class="tiles" id="system"></div>
  <div class="err" id="error"></div>
  <div id="programme"></div>
  <h2>Runs</h2>
  <div class="runs" id="runs"></div>
  <h2>Scores</h2>
  <div class="panel"><details><summary>What the score columns mean</summary><div class="legend" id="legend" style="margin-top:8px"></div></details></div>
  <div id="scores"></div>
  <h2>Other processes on this machine</h2>
  <div class="tablewrap"><table id="others"></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v, d = 1) => v == null || Number.isNaN(v) ? '-' : Number(v).toFixed(d);
const ago = s => s == null ? '-' : s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
const dur = min => min == null ? '-' : min < 90 ? `${Math.round(min)} min` : `${(min / 60).toFixed(1)} h`;
const clock = t => t ? new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
let last = 0;
const sortState = {};
const openDetails = new Set();
let metrics = {};

function tile(k, v) { return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`; }

function renderSystem(d) {
  const s = d.system, g = d.gpu;
  let html = tile('CPU', `${fmt(s.cpu, 0)} %<span class="age"> of ${s.cores} cores</span>`)
    + tile('Memory', `${fmt(s.memUsedGb)} / ${fmt(s.memTotalGb, 0)} GB`);
  html += g.error ? tile('GPU', `<span class="bad">${esc(g.error)}</span>`)
    : tile(g.name.replace('NVIDIA GeForce ', 'GPU '), `${fmt(g.util, 0)} % <span class="age">${fmt(g.memUsedGb)}/${fmt(g.memTotalGb, 0)} GB, ${fmt(g.tempC, 0)} C, ${fmt(g.powerW, 0)} W</span>`);
  for (const dr of s.drives) {
    const cls = dr.freeGb < 50 ? 'bad' : dr.freeGb < 150 ? 'warn' : '';
    html += tile(`Drive ${dr.drive}`, `<span class="${cls}">${dr.freeGb} GB</span><span class="age"> free of ${dr.totalGb}</span>`);
  }
  $('system').innerHTML = html;
}

function renderProgramme(p) {
  if (!p || $('programme').dataset.done) return;
  $('programme').dataset.done = '1';
  $('programme').innerHTML = `<h2>What this is</h2><div class="panel programme"><details open><summary>${esc(p.title)}</summary>
    <ul>${p.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details></div>`;
}

function explainBlock(r) {
  if (!r.setup && !r.predictions.length && !r.kill && !r.caveat) return '';
  const key = r.tag;
  const open = openDetails.has(key) || (!openDetails.has('!' + key) && r.kind === 'training');
  return `<details class="explain" data-key="${esc(key)}" ${open ? 'open' : ''}><summary>Setup, what was predicted, and what to read it beside</summary>
    ${r.setup ? `<p><b>Setup.</b> ${esc(r.setup)}</p>` : ''}
    ${r.predictions.length ? `<p><b>Predicted before it ran:</b></p><ol>${r.predictions.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
    ${r.kill ? `<p class="kill"><b>Kill line.</b> ${esc(r.kill)}</p>` : ''}
    ${r.caveat ? `<p class="caveat"><b>Read it with.</b> ${esc(r.caveat)}</p>` : ''}
  </details>`;
}

function renderRun(r) {
  const p = r.process, pr = r.progress || {};
  const stateCls = ['running', 'done', 'failed', 'stopped'].includes(r.state) ? r.state : 'waiting';
  let rows = '';
  if (p) {
    rows += `<div><span class="k">PID</span> ${p.pid} ${esc(p.name)}${p.children ? ` (+${p.children})` : ''}</div>`
      + `<div><span class="k">CPU</span> ${fmt(p.cpu, 0)} % <span class="k">memory</span> ${fmt(p.memGb)} GB</div>`
      + `<div><span class="k">started</span> ${clock(p.started)}</div>`;
  }
  if (pr.done != null) rows += `<div><span class="k">progress</span> ${pr.done.toLocaleString()}${pr.total ? ' / ' + pr.total.toLocaleString() : ''}</div>`;
  if (pr.rate) rows += `<div><span class="k">rate</span> ${esc(pr.rate)}</div>`;
  if (pr.elapsedMin != null) rows += `<div><span class="k">elapsed</span> ${dur(pr.elapsedMin)} <span class="k">to the step cap</span> ${dur(pr.etaCapMin)}</div>`;
  if (pr.best) rows += `<div><span class="k">best validation loss</span> ${esc(pr.best)} <span class="k">learning rate</span> ${esc(pr.lr)}</div>`;
  if (r.status) rows += `<div><span class="k">status</span> ${esc(r.status)} <span class="k">(${ago(r.statusAge)} ago)</span></div>`;
  if (r.logAge != null) {
    const stale = r.state === 'running' && r.logAge > 900;
    rows += `<div><span class="k">log written</span> <span class="${stale ? 'warn' : ''}">${ago(r.logAge)} ago</span></div>`;
  }
  if (r.stopRequested) rows += `<div class="warn">stop file present: ${esc(r.stopFile)}</div>`;
  if (r.resultReady) rows += `<div><span class="k">result</span> ${esc(r.result)}</div>`;
  for (const s of r.datastores || []) {
    const free = s.free ? `${s.free.freeGb} GB free on ${s.free.drive}` : '';
    rows += `<div><span class="k">data</span> <span class="${s.exists ? '' : 'bad'}">${esc(s.path)}</span> <span class="k">${free}</span></div>`;
  }
  const pct = pr.done != null && pr.total ? Math.min(100, 100 * pr.done / pr.total) : null;
  return `<div class="run">
    <div class="title">${esc(r.title)}</div>
    <div class="top"><span class="state ${stateCls}">${esc(r.state)}</span><span class="kind">${esc(r.kind)}</span><span class="tag">${esc(r.tag)}</span>
    ${pct != null ? `<span class="age">${pct.toFixed(1)} %</span>` : ''}</div>
    ${r.what ? `<div class="what">${esc(r.what)}</div>` : ''}
    ${r.question ? `<div class="question"><b>The question.</b> ${esc(r.question)}</div>` : ''}
    ${explainBlock(r)}
    ${pct != null ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ''}
    <div class="grid">${rows}</div>
    ${pr.last ? `<div class="last">${esc(pr.last)}</div>` : ''}
  </div>`;
}

document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.explain')) return;
  const key = d.dataset.key;
  if (d.open) { openDetails.add(key); openDetails.delete('!' + key); } else { openDetails.delete(key); openDetails.add('!' + key); }
}, true);

function table(id, cols, rows) {
  const st = sortState[id];
  if (st) rows = [...rows].sort((a, b) => (a[st.key] > b[st.key] ? 1 : a[st.key] < b[st.key] ? -1 : 0) * st.dir);
  const head = '<tr>' + cols.map(c => {
    const m = metrics[c.key];
    const arrow = m && m.better === 'higher' ? ' ↑' : m && m.better === 'lower' ? ' ↓' : '';
    return `<th class="${c.cls || ''}" data-t="${id}" data-k="${c.key}" title="${esc(m ? m.what : '')}">${esc(c.label)}${arrow}</th>`;
  }).join('') + '</tr>';
  const body = rows.map(r => '<tr>' + cols.map(c => `<td class="${c.cls || ''}">${c.f ? c.f(r[c.key], r) : esc(r[c.key])}</td>`).join('') + '</tr>').join('');
  return head + body;
}

document.addEventListener('click', e => {
  const th = e.target.closest('th[data-t]');
  if (!th) return;
  const id = th.dataset.t, key = th.dataset.k;
  const st = sortState[id];
  sortState[id] = { key, dir: st && st.key === key ? -st.dir : -1 };
  refresh();
});

function renderLegend(m) {
  if ($('legend').dataset.done || !Object.keys(m).length) return;
  $('legend').dataset.done = '1';
  $('legend').innerHTML = Object.values(m).filter(x => x.better).map(x =>
    `<div><b>${esc(x.label)}</b> <span class="better">(${x.better} is better)</span><br>${esc(x.what)}</div>`).join('');
}

function renderOthers(list) {
  $('others').innerHTML = list.length ? table('others', [
    { key: 'pid', label: 'PID' }, { key: 'name', label: 'process' },
    { key: 'cpu', label: 'CPU %', f: v => fmt(v, 0) }, { key: 'memGb', label: 'GB', f: v => fmt(v) },
    { key: 'started', label: 'started', f: clock }, { key: 'cmd', label: 'command', cls: 'cmd' },
  ], list) : '<tr><td>none over 1 % CPU or 0.5 GB</td></tr>';
}

function renderScores(sets) {
  $('scores').innerHTML = sets.map((s, i) => `<h2>${esc(s.name)}</h2><div class="tablewrap"><table>${table('scores' + i, [
    { key: 'model', label: 'model' }, { key: 'what', label: 'what it is', cls: 'text' },
    { key: 'clean5', label: 'clean 5-20', f: v => fmt(v) }, { key: 'clean20', label: 'clean 20-100', f: v => fmt(v) },
    { key: 'clean100', label: 'clean 100-1000', f: v => fmt(v) }, { key: 'dug100', label: 'dug 100-1000', f: v => fmt(v) },
    { key: 'cleanSat', label: 'clean saturated', f: v => fmt(v) }, { key: 'brightCore', label: 'bright-core %', f: v => fmt(v) },
    { key: 'farSky', label: 'far sky', f: v => fmt(v, 2) }, { key: 'when', label: 'scored', f: clock },
  ], s.rows)}</table></div>`).join('');
}

async function refresh() {
  try {
    const d = await (await fetch('/api/status', { cache: 'no-store' })).json();
    last = Date.now();
    metrics = d.metrics || {};
    $('error').textContent = '';
    renderSystem(d);
    renderProgramme(d.programme);
    $('runs').innerHTML = d.runs.map(renderRun).join('');
    renderLegend(metrics);
    renderScores(d.scores);
    renderOthers(d.others);
  } catch (e) {
    $('error').textContent = 'The dashboard server is not answering: ' + e;
  }
}
setInterval(() => { $('age').textContent = last ? `updated ${Math.round((Date.now() - last) / 1000)} s ago` : 'loading...'; }, 1000);
setInterval(refresh, 5000);
refresh();
</script>
</body>
</html>
