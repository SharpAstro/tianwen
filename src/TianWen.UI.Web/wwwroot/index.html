<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Text-only: the favicon below is already the telescope emoji, so an emoji here would
         show twice next to the tab label. Boot-time fallback; each view sets "Astro - <view>". -->
    <title>Astro - Planner</title>
    <base href="/" />
    <!-- Publish-time fingerprinting (OverrideHtmlAssetPlaceholders): the preload id, the importmap
         element, and the #[.{fingerprint}] marker below are rewritten to the hashed asset names.
         Without them the published page 404s on _framework/blazor.webassembly.js (only the
         fingerprinted file exists). Mirrors Chess.Web. -->
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Zero-asset favicon: the 🔭 the app is named for, as an inline SVG data URI. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-spinner"></div>
            <div class="boot-text">Loading TianWen...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x1F5D9;</span>
    </div>

    <!-- The WebGl.Renderer JS module (_content/WebGl.Renderer/webgl-renderer.js) is imported by the
         library itself via JSHost.ImportAsync - no script tag needed here. -->

    <!-- Best-effort browser geolocation for the observing site.
         tianwenGeoState: the Permissions-API state ('granted' | 'prompt' | 'denied' | 'unknown') so
         the app can decide whether a position fetch is instant or will open a permission prompt.
         tianwenGeo(waitForPrompt): resolves [lat, lon] or null. With waitForPrompt=true there is NO
         timeout - the promise waits for the user's prompt decision (a fixed timeout here is exactly
         what made "Allow" appear dead: it expired while the prompt was still open, so the grant
         landed after the app had given up until the next refresh). -->
    <script>
        window.tianwenGeoState = function () {
            if (!navigator.permissions || !navigator.geolocation) return Promise.resolve("unknown");
            return navigator.permissions.query({ name: "geolocation" })
                .then(function (s) { return s.state; })
                .catch(function () { return "unknown"; });
        };
        // Canvas metrics / resize watching / focus / drag pointer-capture all moved into
        // WebGl.Renderer 1.2's <WebGlCanvas> component - only the geolocation helpers remain.
        window.tianwenGeo = function (waitForPrompt) {
            return new Promise(function (resolve) {
                if (!navigator.geolocation) { resolve(null); return; }
                var opts = waitForPrompt
                    ? { maximumAge: 600000 }
                    : { timeout: 10000, maximumAge: 600000 };
                navigator.geolocation.getCurrentPosition(
                    function (p) { resolve([p.coords.latitude, p.coords.longitude]); },
                    function () { resolve(null); },
                    opts);
            });
        };

        // F3 opens the in-app catalog search (the sky atlas). The <canvas> keydown handler runs
        // our search, but the browser ALSO fires its native find-in-page for F3 -- so both open at
        // once. Cancel the browser default here (capture phase, so it wins before anything else);
        // the canvas keydown listener still fires, so our search opens and the browser bar does
        // not. The whole page is one canvas app, so there is nothing for browser find to match
        // anyway. Blazor's plain @onkeydown can't preventDefault after the fact, hence this listener.
        window.addEventListener("keydown", function (e) {
            if (e.key === "F3") {
                e.preventDefault();
            }
        }, { capture: true });

        // A trackpad pinch-zoom (and ctrl+scroll) reaches the page as ctrl+wheel; the browser's native
        // default zooms the WHOLE PAGE (chrome and all). This showcase owns zoom itself -- the canvas
        // pinch-zoom + the sky-map wheel-zoom -- so cancel the browser default page-wide. window-level +
        // non-passive + capture so it wins over EVERY region (toolbar / title / the selectable-text DOM
        // overlay), not just the canvas -- a canvas-only guard leaves a pinch over the chrome still zooming.
        // preventDefault does not stop propagation, so the canvas's @onwheel still routes the delta to the
        // app (SkyMap zooms toward the cursor). Keyboard ctrl +/-/0 is deliberately left alone (accessibility
        // zoom). Same reason as the F3 guard above: a passive Blazor @onwheel can't preventDefault this.
        window.addEventListener("wheel", function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false, capture: true });
</script>

    <!-- IndexedDB cache for the decoded Tycho-2 star buffer (window.tyc2Cache). Loaded before
         Blazor so it's defined by the time the atlas first opens. -->
    <script src="tyc2-cache.js"></script>

    <!-- E2E-only view-state hook. When the app is opened with ?e2e=1, Blazor calls __tianwenTestInit
         with a .NET ref (see Planner.razor), so browser tests can read LIVE sky-map view state -
         window.__tianwenTest.getSkyView() -> {fovDeg, centerRA, centerDec} - via page.evaluate. This
         is how a single-WebGL-canvas app asserts "the gesture zoomed/panned" with no DOM to inspect
         and no pixel reads. Defined always (a harmless no-op until called); never invoked in a normal
         session because Planner only calls __tianwenTestInit behind the ?e2e=1 gate. -->
    <script>
        window.__tianwenTestInit = function (ref) {
            window.__tianwenTest = {
                getSkyView: function () { return ref.invokeMethodAsync('GetSkyViewJson'); },
                // Canvas-drawn planner search box + autocomplete row rects (CSS px), so an E2E can click
                // the canvas at the exact target (there is no DOM for these). Return "null" when absent.
                getPlannerSearchRect: function () { return ref.invokeMethodAsync('GetPlannerSearchRectJson'); },
                getPlannerSuggestionRect: function (i) { return ref.invokeMethodAsync('GetPlannerSuggestionRectJson', i); },
                // Repaint accounting -> {frames, coalesced, gathers}. Lets a test assert the two perf
                // properties of a continuous gesture (frames coalesce onto vsync; the overlay cache does
                // not re-gather per event) without reading a Chrome trace by hand.
                getRenderStats: function () { return ref.invokeMethodAsync('GetRenderStatsJson'); },
                // Pins/unpins a catalog object, so a test can reach the WITH-PINS configuration. That
                // configuration is not a detail: the object-overlay pass runs on every frame whenever
                // anything is pinned (a pinned target is a landmark and stays visible with [O] off), so
                // an empty planner exercises an early-out and measures none of it. A whole performance
                // investigation was run against an empty planner and missed a gather walking the grid
                // per view change to produce two markers.
                pinObject: function (name) { return ref.invokeMethodAsync('PinObjectForTest', name); },
            };
        };
    </script>

    <!-- autostart="false" so the boot can go through loadBootResource below. Everything else about
         the tag, including the fingerprint placeholder, is unchanged. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <!-- Retry a failed asset fetch before giving up.

         GitHub Pages occasionally answers 503 for a single asset, and a cold Blazor load requests
         about a hundred of them. One failure is fatal: the runtime has no retry, so the page dies on
         "An unhandled error has occurred" and the console blames the wrong thing entirely -- with SRI
         enabled the integrity check hashes the ERROR PAGE body, so it reports a digest mismatch on a
         file that is perfectly fine on the next request. That was observed on the deployed site with
         no deployment in flight and the asset serving 200 seconds later.

         Two details this must not get wrong:

         The integrity string is passed STRAIGHT THROUGH to fetch, so SRI still applies to every
         retry. Dropping it would "fix" the symptom by disabling the check that makes a tampered
         asset detectable, which is not a trade worth making for a transient 503.

         A 503 arrives in TWO shapes and both need catching: with integrity set the promise REJECTS
         (the error-page body fails the digest), and without it the promise resolves with ok=false.
         Handling only the rejection would leave half the cases dead.

         dotnetjs is deliberately not intercepted -- that resource must resolve to a URI the runtime
         can import(), not a Response, so returning null leaves it on the default path. It is the
         loader itself; if it fails there is nothing to retry into. -->
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type === "dotnetjs") return null;

                // The FIRST attempt uses default caching, so a warm repeat visit still serves ~100
                // assets from the browser cache. Only a RETRY forces revalidation, which is what
                // clears a poisoned cache entry -- the shape that explains the same URL failing
                // repeatedly in one browser while another loads it fine, since the caches are
                // separate. Sending no-cache on every asset every boot would trade a hundred
                // conditional requests for a fault that happens rarely.
                var base = integrity ? { integrity: integrity } : {};
                var reload = integrity ? { integrity: integrity, cache: "reload" } : { cache: "reload" };
                // 0 then ~200 ms then ~600 ms: enough for a CDN edge to settle, short enough that a
                // genuinely missing asset still fails fast rather than hanging the boot spinner.
                var delays = [0, 200, 600];

                var attempt = function (i) {
                    return fetch(defaultUri, i === 0 ? base : reload).then(function (response) {
                        if (response.ok || i >= delays.length - 1) return response;
                        return retry(i + 1, response.status + " " + response.statusText);
                    }, function (err) {
                        if (i >= delays.length - 1) throw err;
                        return retry(i + 1, err);
                    });
                };

                var retry = function (i, reason) {
                    console.warn("Retrying " + name + " (attempt " + (i + 1) + "):", reason);
                    return new Promise(function (resolve) {
                        setTimeout(function () { resolve(attempt(i)); }, delays[i]);
                    });
                };

                return attempt(0);
            }
        });
    </script>
</body>

</html>
